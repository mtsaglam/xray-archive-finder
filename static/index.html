    {id: "racslow", label: "RACS-low 888 MHz", bases: ["https://casda.csiro.au/hips/RACS/low/I"], fmt: "fits", unit: "Jy/beam", dec: [-90, 30]},
    {id: "sumss", label: "SUMSS 843 MHz", bases: ["https://casda.csiro.au/hips/SUMSS"], fmt: "fits", unit: "Jy/beam", dec: [-90, -30]},
  ],
};
const CUT_BY_ID = Object.fromEntries([...CUT.x, ...CUT.radio].map((s) => [s.id, s]));
const cutLabel = (s, l) => (typeof s.label === "string" ? s.label : s.label[l || lang] || s.label.en);
const INFERNO = [[0, "#000004"], [0.13, "#1b0c41"], [0.25, "#4a0c6b"], [0.38, "#781c6d"], [0.5, "#a52c60"], [0.63, "#cf4446"],
  [0.75, "#ed6925"], [0.88, "#fb9b06"], [1, "#fcffa4"]];
const CUT_N = 200;
const propsCache = {}, tileCache = new Map();

function ang2xyf(order, ra, dec) {
  const nside = 2 ** order, z = Math.sin(dec * D2R), za = Math.abs(z);
  let tt = ((ra % 360) + 360) % 360 / 90;
  if (tt >= 4) tt = 0;
  if (za <= 2 / 3) {
    const t1 = nside * (0.5 + tt), t2 = nside * z * 0.75;
    const jp = Math.floor(t1 - t2), jm = Math.floor(t1 + t2);
    const ifp = Math.floor(jp / nside), ifm = Math.floor(jm / nside);
    const face = ifp === ifm ? (ifp | 4) : (ifp < ifm ? ifp : ifm + 8);
    return [face, jm & (nside - 1), nside - (jp & (nside - 1)) - 1];
  }
  const ntt = Math.min(3, Math.floor(tt)), tp = tt - ntt, tmp = nside * Math.sqrt(3 * (1 - za));
  const jp = Math.min(Math.floor(tp * tmp), nside - 1), jm = Math.min(Math.floor((1 - tp) * tmp), nside - 1);
  return z >= 0 ? [ntt, nside - jm - 1, nside - jp - 1] : [ntt + 8, jp, jm];
}

function interleave(x, y) {
  let r = 0;
  for (let b = 0; b < 16; b++) r += (((x >> b) & 1) << (2 * b)) + (((y >> b) & 1) << (2 * b + 1));
  return r >>> 0;
}

const pixDeg = (order) => Math.sqrt(4 * Math.PI / (12 * 4 ** order)) / D2R;

function tanToSky(ra0, dec0, xi, eta) {
  const x = xi * D2R, y = eta * D2R, d0 = dec0 * D2R, rho = Math.hypot(x, y);
  if (rho === 0) return [ra0, dec0];
  const c = Math.atan(rho), sc = Math.sin(c), cc = Math.cos(c);
  const dec = Math.asin(cc * Math.sin(d0) + y * sc * Math.cos(d0) / rho);
  const ra = ra0 + Math.atan2(x * sc, rho * Math.cos(d0) * cc - y * Math.sin(d0) * sc) / D2R;
  return [((ra % 360) + 360) % 360, dec / D2R];
}

function skyToTan(ra0, dec0, ra, dec) {
  const a = (ra - ra0) * D2R, d = dec * D2R, d0 = dec0 * D2R;
  const cosc = Math.sin(d0) * Math.sin(d) + Math.cos(d0) * Math.cos(d) * Math.cos(a);
  return [Math.cos(d) * Math.sin(a) / cosc / D2R, (Math.cos(d0) * Math.sin(d) - Math.sin(d0) * Math.cos(d) * Math.cos(a)) / cosc / D2R];
}

function parseFits(buf) {
  if (buf.byteLength < 2880 || String.fromCharCode(...new Uint8Array(buf, 0, 6)) !== "SIMPLE") return null;
  const dv = new DataView(buf), hdr = {};
  let off = 0, done = false;
  while (!done && off + 2880 <= buf.byteLength) {
    for (let i = 0; i < 36; i++) {
      const card = String.fromCharCode(...new Uint8Array(buf, off + i * 80, 80));
      const key = card.slice(0, 8).trim();
      if (key === "END") { done = true; break; }
      if (card[8] === "=") hdr[key] = card.slice(10).split("/")[0].replace(/'/g, "").trim();
    }
    off += 2880;
  }
  const bitpix = +hdr.BITPIX, w = +hdr.NAXIS1, h = +hdr.NAXIS2, bs = +(hdr.BSCALE || 1), bz = +(hdr.BZERO || 0);
  const blank = hdr.BLANK !== undefined ? +hdr.BLANK : null, nb = Math.abs(bitpix) / 8, out = new Float32Array(w * h);
  if (!done || !(w > 0) || off + w * h * nb > buf.byteLength) return null;
  const get = {"-32": (p) => dv.getFloat32(p), "-64": (p) => dv.getFloat64(p), "16": (p) => dv.getInt16(p), "32": (p) => dv.getInt32(p), "8": (p) => dv.getUint8(p)}[bitpix];
  for (let i = 0; i < w * h; i++) {
    const v = get(off + i * nb);
    out[i] = blank !== null && bitpix > 0 && v === blank ? NaN : bz + bs * v;
  }
  return {data: out, w};
}

async function hipsProps(sv) {
  if (!propsCache[sv.id]) {
    propsCache[sv.id] = (async () => {
      for (const base of sv.bases) {
        try {
          const r = await fetchTimeout(base + "/properties", 10000);
          if (!r.ok) continue;
          const kv = {};
          (await r.text()).split("\n").forEach((l) => { const m = l.match(/^\s*([\w.]+)\s*=\s*(.*)$/); if (m) kv[m[1]] = m[2].trim(); });
          return {base, order: +kv.hips_order, width: +(kv.hips_tile_width || 512)};
        } catch (e) { /* next mirror */ }
      }
      throw new Error("HiPS unreachable: " + cutLabel(sv));
    })();
    propsCache[sv.id].catch(() => delete propsCache[sv.id]);
  }
  return propsCache[sv.id];
}

async function fetchTile(url, fmt) {
  const r = await fetchTimeout(url, 30000);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("HTTP " + r.status);
  if (fmt === "fits") {
    let buf = await r.arrayBuffer();
    const magic = new Uint8Array(buf, 0, Math.min(2, buf.byteLength));
    // some servers (SkyView) send gzipped FITS without a Content-Encoding header
    if (magic[0] === 0x1f && magic[1] === 0x8b && typeof DecompressionStream !== "undefined") {
      buf = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
    }
    const f = parseFits(buf);
    return f && Object.assign(f, {fits: true});
  }
  const bmp = await createImageBitmap(await r.blob());
  const cv = document.createElement("canvas");
  cv.width = bmp.width; cv.height = bmp.height;
  const ctx = cv.getContext("2d");
  ctx.drawImage(bmp, 0, 0);
  const px = ctx.getImageData(0, 0, cv.width, cv.height).data, out = new Float32Array(cv.width * cv.height);
  for (let i = 0; i < out.length; i++) out[i] = px[4 * i + 3] === 0 ? NaN : 0.299 * px[4 * i] + 0.587 * px[4 * i + 1] + 0.114 * px[4 * i + 2];
  return {data: out, w: cv.width, fits: false};
}

function loadTile(url, fmt) {
  if (!tileCache.has(url)) {
    const p = fetchTile(url, fmt);
    p.catch(() => tileCache.delete(url));
    tileCache.set(url, p);
    if (tileCache.size > 200) tileCache.delete(tileCache.keys().next().value);
  }
  return tileCache.get(url);
}

// Resample a HiPS survey onto an n×n gnomonic grid centred on (ra0, dec0); pixel (i, j): i=0 east, j=0 south.
async function hipsCutout(sv, ra0, dec0, fovDeg, n) {
  const P = await hipsProps(sv);
  const W = P.width, lw = Math.round(Math.log2(W)), scale = fovDeg / n, c = (n - 1) / 2;
  let K = 3 + lw;
  while (K < P.order + lw && pixDeg(K) > scale) K++;
  const k = K - lw, need = new Map(), out = new Float32Array(n * n).fill(NaN);
  for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
    const [ra, dec] = tanToSky(ra0, dec0, -(i - c) * scale, (j - c) * scale);
    const [face, ix, iy] = ang2xyf(K, ra, dec);
    const N = face * 4 ** k + interleave(Math.floor(ix / W), Math.floor(iy / W));
    let list = need.get(N);
    if (!list) need.set(N, (list = []));
    list.push(j * n + i, ix % W, iy % W);
  }
  // Pixel order inside a tile (validated against bright sources): FITS row = W-1-x, PNG/JPEG row = x; column = y.
  await Promise.all([...need].map(async ([N, list]) => {
    const tile = await loadTile(`${P.base}/Norder${k}/Dir${Math.floor(N / 10000) * 10000}/Npix${N}.${sv.fmt}`, sv.fmt);
    if (!tile) return;
    for (let q = 0; q < list.length; q += 3) {
      const x = list[q + 1], y = list[q + 2];
      out[list[q]] = tile.fits ? tile.data[(W - 1 - x) * W + y] : tile.data[x * W + y];
    }
  }));
  return {data: out, n, scale, pixArcsec: pixDeg(K) * 3600, ra0, dec0, sv};
}

function gaussSmooth(data, n, sig) {
  if (!(sig > 0.25)) return data;
  const r = Math.ceil(3 * sig), ker = [];
  for (let k = -r; k <= r; k++) ker.push(Math.exp(-0.5 * (k / sig) ** 2));
  const pass = (val, wt, horiz) => {
    const v2 = new Float32Array(n * n), w2 = new Float32Array(n * n);
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      let sv = 0, sw = 0;
      for (let k = -r; k <= r; k++) {
        const ii = horiz ? i + k : i, jj = horiz ? j : j + k;
        if (ii < 0 || jj < 0 || ii >= n || jj >= n) continue;
        const q = jj * n + ii;
        sv += ker[k + r] * val[q]; sw += ker[k + r] * wt[q];
      }
      v2[j * n + i] = sv; w2[j * n + i] = sw;
    }
    return [v2, w2];
  };
  const val = new Float32Array(n * n), wt = new Float32Array(n * n);
  for (let q = 0; q < n * n; q++) if (Number.isFinite(data[q])) { val[q] = data[q]; wt[q] = 1; }
  const [v1, w1] = pass(val, wt, true), [v3, w3] = pass(v1, w1, false);
  const out = new Float32Array(n * n);
  for (let q = 0; q < n * n; q++) out[q] = w3[q] > 0.05 && Number.isFinite(data[q]) ? v3[q] / w3[q] : NaN;
  return out;
}

function robustRms(data) {
  const v = Array.from(data).filter(Number.isFinite).sort((a, b) => a - b);
  if (v.length < 20) return NaN;
  const med = v[v.length >> 1], dev = v.map((x) => Math.abs(x - med)).sort((a, b) => a - b);
  return 1.4826 * dev[dev.length >> 1];
}

function toRows(arr, n, f) {
  const rows = [];
  for (let j = 0; j < n; j++) { const row = new Array(n); for (let i = 0; i < n; i++) row[i] = f(arr[j * n + i]); rows.push(row); }
  return rows;
}

function stretchFn(kind, lo, hi) {
  const span = hi - lo || 1;
  return {
    linear: (v) => v - lo,
    sqrt: (v) => Math.sqrt(Math.max(v - lo, 0)),
    log: (v) => Math.log10(Math.max(v - lo, 0) + span * 1e-3),
    asinh: (v) => Math.asinh((v - lo) / (0.02 * span)),
  }[kind];
}

function fillCutSelects() {
  const dec = state ? state.src.dec : 0;
  const opts = (list) => list.map((s) => `<option value="${s.id}"${s.dec && !inDec(s.dec, dec) ? " disabled" : ""}>${esc(cutLabel(s))}</option>`).join("");
  const x = $("xrX").value, r = $("xrR").value;
  $("xrX").innerHTML = opts(CUT.x);
  $("xrR").innerHTML = opts(CUT.radio) + `<option value="">${esc(t("none"))}</option>`;
  if (x) $("xrX").value = x;
  if (r !== undefined) $("xrR").value = r;
}

function xrayCandidates() {
  const res = state.results, l = state.src.l;
  const has = (k) => res[k] && res[k].n_done > 0;
  const c = [];
  if (has("chandra")) c.push("chandra");
  if (has("xmm")) c.push("xmm");
  if (has("swift")) c.push("swift");
  if (l > 179.9442 && l < 359.9442) c.push("erosita");
  c.push("swift");
  return [...new Set(c)];
}

const hasData = (cut) => cut && !cut.error && Array.from(cut.data).some((v) => Number.isFinite(v) && v > 0);

async function runXr(sid) {
  $("xr").classList.remove("hidden");
  fillCutSelects();
  const r = (CUT.radio.find((s) => inDec(s.dec, state.src.dec)) || {id: ""}).id;
  $("xrR").value = r;
  state.xr = {};
  // try the X-ray surveys in order of preference and keep the first one that has pixels here
  const cands = xrayCandidates();
  for (let i = 0; i < cands.length; i++) {
    $("xrX").value = cands[i];
    $("xrFov").value = String(CUT_BY_ID[cands[i]].fov);
    $("xrSig").value = CUT_BY_ID[cands[i]].sig;
    await computeXr(sid, i < cands.length - 1);
    if (sid !== searchSeq || hasData(state.xr.xc)) break;
  }
  if (sid === searchSeq && state.xr.xc && !state.xr.drawn) drawXr();
}

async function computeXr(sid, probing) {
  if (!state || sid !== searchSeq) return;
  const xs = CUT_BY_ID[$("xrX").value], rs = CUT_BY_ID[$("xrR").value], fov = (+$("xrFov").value) / 60;
  const {ra, dec} = state.src, token = {};
  state.xrToken = token;
  $("xrStatus").innerHTML = `<span class="spin"></span> ${esc(t("xrLoading"))}`;
  const [xc, rc] = await Promise.all([
    hipsCutout(xs, ra, dec, fov, CUT_N).catch((e) => ({error: e.message})),
    rs ? hipsCutout(rs, ra, dec, fov, CUT_N).catch((e) => ({error: e.message})) : Promise.resolve(null)]);
  if (sid !== searchSeq || state.xrToken !== token) return;
  state.xr = {xc, rc, drawn: false};
  $("xrStatus").textContent = "";
  if (probing && !hasData(xc)) return;
  state.xr.drawn = true;
  drawXr();
}

async function drawXr() {
  if (!state || !state.xr || !state.xr.xc) return;
  const {xc, rc} = state.xr;
  let P;
  try { P = await loadPlotly(); } catch (e) { $("xrStatus").textContent = e.message; return; }
  const n = CUT_N, traces = [];
  const scale = xc.scale || (rc && rc.scale);
  $("xrSigV").textContent = $("xrSig").value;
  if (!scale) {
    P.purge("xrPlot");
    $("xrInfo").textContent = [xc.error, rc && rc.error].filter(Boolean).join(" · ");
    return;
  }
  const ax = Array.from({length: n}, (_, i) => -(i - (n - 1) / 2) * scale * 60);
  const ay = Array.from({length: n}, (_, j) => (j - (n - 1) / 2) * scale * 60);
  const info = {x: cutLabel(CUT_BY_ID[$("xrX").value]), xp: "—", r: rc && rc.sv ? cutLabel(rc.sv) : (rc && rc.error) || t("none")};
  let note = "";
  if (xc.error) note = xc.error;
  else {
    const sm = gaussSmooth(xc.data, n, (+$("xrSig").value) / 3600 / xc.scale);
    const lo = quantile(Array.from(sm), 0.01), hi = quantile(Array.from(sm), 0.997);
    info.xp = xc.pixArcsec.toFixed(1);
    if (!Number.isFinite(lo)) note = t("xrNoData");
    else {
      const f = stretchFn($("xrStr").value, lo, hi);
      traces.push({type: "heatmap", x: ax, y: ay, z: toRows(sm, n, (v) => (Number.isFinite(v) ? f(v) : null)),
        customdata: toRows(sm, n, (v) => (Number.isFinite(v) ? v : null)), colorscale: INFERNO, zmin: f(lo), zmax: f(hi),
        showscale: false, hovertemplate: `Δα %{x:.2f}′ · Δδ %{y:.2f}′<br>X-ray %{customdata:.3g} ${esc(xc.sv.unit)}<extra></extra>`});
    }
  }
  if (rc && !rc.error) {
    const rms = robustRms(rc.data), lev = +$("xrLev").value;
    const rsm = gaussSmooth(rc.data, n, 0.6 * rc.pixArcsec / 3600 / rc.scale);
    const peak = Math.max(...Array.from(rsm).filter(Number.isFinite));
    info.rp = rc.pixArcsec.toFixed(1);
    info.rms = Number.isFinite(rms) ? (rms * 1000).toPrecision(2) : "?";
    if (lev > 0 && Number.isFinite(rms) && rms > 0) {
      const l0 = lev * rms;
      info.l0 = (l0 * 1000).toPrecision(2);
      if (peak > l0) {
        traces.push({type: "contour", x: ax, y: ay, z: toRows(rsm, n, (v) => (Number.isFinite(v) ? Math.log10(Math.max(v, l0 * 0.5)) : null)),
          showscale: false, hoverinfo: "skip", name: cutLabel(rc.sv), showlegend: true, line: {width: 1.3},
          colorscale: [[0, "#3fd0ff"], [1, "#3fd0ff"]],
          contours: {coloring: "lines", start: Math.log10(l0), end: Math.log10(peak), size: Math.log10(2)}});
      } else note = (note ? note + " · " : "") + t("xrNoContours");
    } else info.l0 = "—";
  } else if (rc && rc.error) info.r = rc.error;
  // source position and the nearest catalogue matches
  const marks = [{name: t("xrSrc"), xi: 0, eta: 0, sym: "cross-thin-open", col: "#ffffff", size: 16}];
  const half = scale * n / 2;
  for (const [key, res] of Object.entries(state.cats || {})) {
    if (!res || !res.hits || !res.hits.length) continue;
    const h = res.hits[0];
    if (!Number.isFinite(h.ra)) continue;
    const [xi, eta] = skyToTan(state.src.ra, state.src.dec, h.ra, h.dec);
    if (Math.abs(xi) > half || Math.abs(eta) > half) continue;
    const isX = res.cat.kind === "x";
    marks.push({name: `${res.cat.label}${h.name ? ": " + h.name : ""}`, xi, eta, sym: isX ? "circle-open" : "diamond-open", col: isX ? "#7CFC00" : "#3fd0ff", size: 11});
  }
  marks.forEach((m) => traces.push({type: "scatter", mode: "markers", x: [m.xi * 60], y: [m.eta * 60], name: m.name,
    marker: {symbol: m.sym, color: m.col, size: m.size, line: {width: 2, color: m.col}}, hovertemplate: `${esc(m.name)}<extra></extra>`, showlegend: false}));
  const layout = plotTheme({margin: {l: 56, r: 10, t: 10, b: 50}, showlegend: false, plot_bgcolor: "#000"});
  layout.xaxis = Object.assign(layout.xaxis, {title: {text: "Δα cos δ (′)"}, autorange: "reversed", constrain: "domain"});
  layout.yaxis = Object.assign(layout.yaxis, {title: {text: "Δδ (′)"}, scaleanchor: "x", scaleratio: 1, constrain: "domain"});
  await P.react("xrPlot", traces, layout, PLOT_CONFIG);
  $("xrInfo").textContent = t("xrInfo")(info) + (note ? " " + note : "");
}

function fitsCard(key, value) {
  let v;
  if (typeof value === "boolean") v = (value ? "T" : "F").padStart(20);
  else if (typeof value === "string") v = `'${value.replace(/[^\x20-\x7e]/g, "-").replace(/'/g, "''").slice(0, 66)}'`.padEnd(20);
  else v = (Number.isInteger(value) ? String(value) : value.toPrecision(12).toUpperCase()).padStart(20);
  return (key.padEnd(8) + "= " + v).padEnd(80).slice(0, 80);
}

function cutoutFits(cut, extra) {
  const n = cut.n, cards = [fitsCard("SIMPLE", true), fitsCard("BITPIX", -32), fitsCard("NAXIS", 2), fitsCard("NAXIS1", n), fitsCard("NAXIS2", n),
    fitsCard("CTYPE1", "RA---TAN"), fitsCard("CTYPE2", "DEC--TAN"), fitsCard("CRPIX1", (n + 1) / 2), fitsCard("CRPIX2", (n + 1) / 2),
    fitsCard("CRVAL1", +cut.ra0.toFixed(8)), fitsCard("CRVAL2", +cut.dec0.toFixed(8)), fitsCard("CDELT1", -cut.scale), fitsCard("CDELT2", cut.scale),
    fitsCard("CUNIT1", "deg"), fitsCard("CUNIT2", "deg"), fitsCard("RADESYS", "ICRS"), fitsCard("BUNIT", cut.sv.unit),
    fitsCard("ORIGIN", "X-ray Archive Finder"), ...extra.map(([k, v]) => fitsCard(k, v))];
  cards.push("END".padEnd(80));
  let head = cards.join("");
  head = head.padEnd(Math.ceil(head.length / 2880) * 2880);
  const dataBytes = Math.ceil(n * n * 4 / 2880) * 2880, buf = new ArrayBuffer(head.length + dataBytes), dv = new DataView(buf);
  for (let i = 0; i < head.length; i++) dv.setUint8(i, head.charCodeAt(i) & 0x7f);
  for (let q = 0; q < n * n; q++) dv.setFloat32(head.length + q * 4, cut.data[q]);
  return new Blob([buf], {type: "application/fits"});
}

function downloadCutout(which) {
  const cut = state && state.xr && state.xr[which];
  if (!cut || cut.error) return;
  const name = (state.src.main_id || state.src.query).replace(/[^\w.+-]+/g, "_");
  const blob = cutoutFits(cut, [["SURVEY", cutLabel(cut.sv, "en").slice(0, 60)], ["HIPSURL", ""], ["PIXSCALE", +cut.pixArcsec.toFixed(3)]].filter(([, v]) => v !== ""));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${name}_${cut.sv.id}_${(+$("xrFov").value)}arcmin.fits`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function initXrControls() {
  const recompute = () => state && computeXr(state.id);
  $("xrX").addEventListener("change", () => {
    const s = CUT_BY_ID[$("xrX").value];
    $("xrFov").value = String(s.fov); $("xrSig").value = s.sig;
    recompute();
  });
  $("xrR").addEventListener("change", recompute);
  $("xrFov").addEventListener("change", recompute);
  ["xrSig", "xrStr", "xrLev"].forEach((id) => $(id).addEventListener(id === "xrSig" ? "input" : "change", () => drawXr()));
  $("xrPng").addEventListener("click", () => loadPlotly().then((P) => P.downloadImage("xrPlot", {format: "png", width: 900, height: 900,
    filename: `${(state.src.main_id || state.src.query).replace(/[^\w.+-]+/g, "_")}_xray_radio`})));
  $("xrFitsX").addEventListener("click", () => downloadCutout("xc"));
  $("xrFitsR").addEventListener("click", () => downloadCutout("rc"));
}

// ---------------------------------------------------------------- catalogue flux plots
const MCRAB = {"20–40 keV": 7.57e-12, "40–100 keV": 9.42e-12};
const PLOT_COLORS = ["#1f77b4", "#ff7f0e", "#2ca02c", "#d62728", "#9467bd", "#8c564b", "#e377c2", "#17becf", "#bcbd22", "#7f7f7f"];
let fluxTimer = null;

function scheduleFluxPlots() {
  clearTimeout(fluxTimer);
  fluxTimer = setTimeout(drawFluxPlots, 250);
}

function bandRange(band) {
  const m = band.match(/([\d.]+)–([\d.]+)\s*keV/);
  return m ? [+m[1], +m[2]] : null;
}

function bandFreq(band) {
  const m = band.match(/([\d.]+)\s*(GHz|MHz)/);
  return m ? +m[1] * (m[2] === "GHz" ? 1 : 1e-3) : null;
}

async function drawFluxPlots() {
  if (!state || !CATMAN) return;
  const cats = state.cats || {};
  const xs = [], rs = [];
  for (const res of Object.values(cats)) {
    if (!res || !res.hits || !res.hits.length || res.hits[0].flux == null) continue;
    const c = res.cat, h = res.hits[0];
    if (c.kind === "x") {
      const br = bandRange(c.band);
      if (!br) continue;
      const k = c.unit === "mCrab" ? MCRAB[c.band] || 7.57e-12 : 1;
      xs.push({c, h, lo: br[0], hi: br[1], f: h.flux * k, en: (h.eneg || 0) * k, ep: (h.epos || 0) * k});
    } else {
      const nu = bandFreq(c.band);
      if (nu) rs.push({c, h, nu, f: h.flux, e: h.epos || h.eneg || 0});
    }
  }
  if (!xs.length && !rs.length) {
    $("fxPlot").innerHTML = `<p class="muted">${esc(t("noFluxes"))}</p>`; $("frPlot").innerHTML = "";
    return;
  }
  let P;
  try { P = await loadPlotly(); } catch (e) { return; }
  // X-ray: band-integrated fluxes drawn across each band
  const xTraces = xs.map((p, i) => {
    const x = Math.sqrt(p.lo * p.hi);
    return {type: "scatter", mode: "markers", name: p.c.label, x: [x], y: [p.f],
      error_x: {type: "data", symmetric: false, array: [p.hi - x], arrayminus: [x - p.lo], thickness: 1.4, width: 0},
      error_y: {type: "data", symmetric: false, array: [p.ep], arrayminus: [Math.min(p.en, p.f * 0.999)], thickness: 1.2, width: 4},
      marker: {size: 9, color: PLOT_COLORS[i % PLOT_COLORS.length]},
      hovertemplate: `<b>${esc(p.c.label)}</b><br>${esc(p.h.name || "")}<br>${esc(p.c.band)}: %{y:.3g} erg/s/cm²<br>${fmt(p.h.sep, 1)}″<extra></extra>`};
  });
  const lx = plotTheme({showlegend: true, legend: {orientation: "h", y: -0.32, font: {size: 10}}, margin: {l: 64, r: 10, t: 10, b: 110}});
  lx.xaxis = Object.assign(lx.xaxis, {type: "log", title: {text: "E (keV)"}});
  lx.yaxis = Object.assign(lx.yaxis, {type: "log", title: {text: "F (erg/s/cm²)"}, exponentformat: "power"});
  if (xs.length) await P.react("fxPlot", xTraces, lx, PLOT_CONFIG);
  else $("fxPlot").innerHTML = `<p class="muted">${esc(t("noFluxes"))}</p>`;
  // Radio: S(ν) with a weighted power-law fit in log space
  const rTraces = rs.map((p, i) => ({type: "scatter", mode: "markers", name: `${p.c.label} (${p.c.band})`, x: [p.nu * 1000], y: [p.f],
    error_y: {type: "data", array: [p.e], thickness: 1.2, width: 4}, marker: {size: 9, color: PLOT_COLORS[(i + 3) % PLOT_COLORS.length]},
    hovertemplate: `<b>${esc(p.c.label)}</b><br>${esc(p.h.name || "")}<br>${esc(p.c.band)}: %{y:.4g} mJy<br>${fmt(p.h.sep, 1)}″<extra></extra>`}));
  const lr = plotTheme({showlegend: true, legend: {orientation: "h", y: -0.32, font: {size: 10}}, margin: {l: 64, r: 10, t: 10, b: 110}});
  lr.xaxis = Object.assign(lr.xaxis, {type: "log", title: {text: "ν (MHz)"}});
  lr.yaxis = Object.assign(lr.yaxis, {type: "log", title: {text: "S (mJy)"}});
  const nus = [...new Set(rs.map((p) => p.nu))];
  if (nus.length >= 2) {
    let sw = 0, sx = 0, sy = 0, sxx = 0, sxy = 0;
    rs.forEach((p) => {
      const x = Math.log10(p.nu), y = Math.log10(p.f), s = Math.max(p.e / p.f || 0, 0.05) / Math.LN10, w = 1 / (s * s);
      sw += w; sx += w * x; sy += w * y; sxx += w * x * x; sxy += w * x * y;
    });
    const det = sw * sxx - sx * sx;
    if (det > 0) {
      const a = (sw * sxy - sx * sy) / det, b = (sy - a * sx) / sw, ea = Math.sqrt(sw / det);
      const lo = Math.min(...nus) * 0.8, hi = Math.max(...nus) * 1.25;
      rTraces.push({type: "scatter", mode: "lines", name: t("alphaFit")(a.toFixed(2), ea.toFixed(2)), x: [lo * 1000, hi * 1000],
        y: [10 ** (b + a * Math.log10(lo)), 10 ** (b + a * Math.log10(hi))], line: {color: "#888", dash: "dash", width: 1.4}, hoverinfo: "skip"});
    }
  }
  if (rs.length) await P.react("frPlot", rTraces, lr, PLOT_CONFIG);
  else $("frPlot").innerHTML = `<p class="muted">${esc(t("noFluxes"))}</p>`;
}

// ---------------------------------------------------------------- batch search
const BATCH_MAX = 500;
const SHORT = {chandra: "Chandra", xmm: "XMM", swift: "Swift", nustar: "NuSTAR", nicer: "NICER", xrism: "XRISM", ixpe: "IXPE",
  erosita: "eROSITA", integral: "INTEGRAL", suzaku: "Suzaku", hitomi: "Hitomi", rxte: "RXTE", rosat: "ROSAT", asca: "ASCA",
  bepposax: "SAX", exosat: "EXOSAT", ginga: "Ginga"};
const XFLUX_ORDER = ["csc", "xmm", "sxps", "erass1", "rxs2", "nustar", "bat"];
const CAT_SHORT = {csc: "CSC", xmm: "5XMM", sxps: "2SXPS", erass1: "eRASS1", rxs2: "2RXS", nustar: "NuSTAR", bat: "BAT"};
const RFLUX_ORDER = ["nvss", "sumss", "wenss"];
let batch = null;

function parseBatchList(text) {
  const out = [];
  for (const raw of text.split(/\r?\n/)) {
    let s = raw.trim();
    if (!s || s.startsWith("#")) continue;
    if (!parseCoords(s) && /[,;\t]/.test(s)) s = s.split(/[,;\t]/)[0].trim();
    s = s.replace(/^["']+|["']+$/g, "").trim();
    if (s) out.push(s);
  }
  if (out.length && /^(names?|sources?|targets?|objects?|coord(inate)?s?|ra[ ,]*dec|input)$/i.test(out[0])) out.shift();
  return out;
}

function bestHit(row, order) {
  for (const k of order) { const r = row.cats[k]; if (r && r.hits.length) return {key: k, cat: r.cat, hit: r.hits[0]}; }
  return null;
}

function batchHeader() {
  const c = t("bCols");
  return `<thead><tr><th>#</th><th>${c.input}</th><th>${c.name}</th><th class="num">RA</th><th class="num">Dec</th><th class="num">${c.total}</th>` +
    MISSIONS.map((m) => `<th class="num">${SHORT[m.key] || m.label}</th>`).join("") +
    `<th>${c.xflux}</th><th>${c.rflux}</th></tr></thead>`;
}

function batchRowHtml(r) {
  const cells = [`<td>${r.i + 1}</td>`, `<td>${esc(r.input)}</td>`];
  if (r.status === "pending") return `<tr>${cells.join("")}<td colspan="${4 + MISSIONS.length + 2}" class="muted"><span class="spin"></span></td></tr>`;
  if (r.status === "fail") return `<tr>${cells.join("")}<td colspan="${4 + MISSIONS.length + 2}" class="err">${t("bNotFound")}</td></tr>`;
  cells.push(`<td>${esc(r.main_id || "—")}</td><td class="num">${r.ra.toFixed(4)}</td><td class="num">${r.dec.toFixed(4)}</td>`);
  if (r.status === "resolved") return `<tr class="ok" data-i="${r.i}">${cells.join("")}<td colspan="${1 + MISSIONS.length + 2}" class="muted"><span class="spin"></span></td></tr>`;
  cells.push(`<td class="num"><b>${fmtInt(r.total)}</b></td>`);
  MISSIONS.forEach((m) => {
    const c = r.counts[m.key];
    cells.push(c == null ? `<td class="num z">?</td>` : `<td class="num${c.n ? "" : " z"}">${fmtInt(c.n)}</td>`);
  });
  const x = bestHit(r, XFLUX_ORDER), rd = bestHit(r, RFLUX_ORDER);
  cells.push(`<td>${x ? fmtFlux(x.hit.flux, null, null, x.cat.unit) + ` <span class="muted">${esc(CAT_SHORT[x.key] || x.cat.label)}</span>` : "—"}</td>`);
  cells.push(`<td>${rd ? fmtFlux(rd.hit.flux, null, null, "mJy") + ` <span class="muted">${esc(rd.cat.label)}</span>` : "—"}</td>`);
  return `<tr class="ok" data-i="${r.i}">${cells.join("")}</tr>`;
}

function renderBatch() {
  if (!batch) return;
  $("btable").innerHTML = batchHeader() + "<tbody>" + batch.rows.map(batchRowHtml).join("") + "</tbody>";
}

function updateBatchRow(r) {
  const tr = $("btable").querySelectorAll("tbody tr")[r.i];
  if (tr) tr.outerHTML = batchRowHtml(r);
}

function setBatchProgress(done, total, msg) {
  $("bbar").style.width = (total ? (100 * done / total) : 0) + "%";
  $("bstatus").textContent = msg || "";
}

async function resolveBatch(rows) {
  const names = rows.filter((r) => !parseCoords(r.input));
  rows.filter((r) => parseCoords(r.input)).forEach((r) => {
    const c = parseCoords(r.input);
    Object.assign(r, {status: "resolved", ra: c.ra, dec: c.dec, main_id: null, otype: ""});
    updateBatchRow(r);
  });
  const CH = 40;
  for (let k = 0; k < names.length && !batch.stopped; k += CH) {
    setBatchProgress(k, names.length, t("bResolving")(Math.min(k + CH, names.length), names.length));
    const chunk = names.slice(k, k + CH);
    const s = await simbadScript(chunk.map((r) => "query id " + r.input.replace(/[\r\n]+/g, " ")).join("\n"), 60000);
    const objs = s ? parseSimbadBatch(s.txt, chunk.length) : chunk.map(() => null);
    chunk.forEach((r, i) => { if (objs[i]) Object.assign(r, {status: "resolved"}, objs[i]); });
    chunk.forEach(updateBatchRow);
  }
  const missing = names.filter((r) => r.status === "pending");
  await pool(missing, 4, async (r) => {
    if (batch.stopped) return;
    const o = await sesame(r.input);
    Object.assign(r, o ? Object.assign({status: "resolved"}, o) : {status: "fail"});
    updateBatchRow(r);
  });
}

async function searchBatchRow(r, radius) {
  const res = await Promise.all(MISSIONS.map((m) => queryMission(m, r.ra, r.dec, radius || m.radius).catch(() => null)));
  r.counts = {};
  res.forEach((x, i) => { r.counts[MISSIONS[i].key] = x && {n: x.n_done, planned: x.n_planned, expo: x.exposure_ks}; });
  r.total = res.reduce((a, x) => a + (x ? x.n_done : 0), 0);
  r.cats = {};
  const cats = await Promise.all(CATMAN.catalogs.map((c) => queryCatalog(c, r.ra, r.dec).catch(() => null)));
  cats.forEach((x, i) => { r.cats[CATMAN.catalogs[i].key] = x; });
  r.status = "done";
}

async function runBatch() {
  if (!MISSIONS.length || (batch && batch.running)) return;
  const fixed = document.querySelector("input[name=rmode]:checked").value === "fixed";
  const radius = fixed ? parseFloat($("radius").value) : null;
  if (fixed && !(radius > 0 && radius <= MAX_RADIUS)) { $("bstatus").textContent = t("radiusErr"); return; }
  setBatchProgress(0, 1, t("bParsing"));
  let entries = parseBatchList($("btext").value);
  if (!entries.length) { setBatchProgress(0, 1, t("bEmpty")); return; }
  const note = entries.length > BATCH_MAX ? t("bTooMany")(entries.length) + " " : "";
  entries = entries.slice(0, BATCH_MAX);
  batch = {rows: entries.map((input, i) => ({i, input, status: "pending", cats: {}, counts: {}})), stopped: false, running: true, radius};
  $("bgo").disabled = true; $("bcsv").disabled = true; $("bstop").classList.remove("hidden");
  renderBatch();
  await resolveBatch(batch.rows);
  const todo = batch.rows.filter((r) => r.status === "resolved");
  let done = 0;
  await pool(todo, 4, async (r) => {
    if (batch.stopped) return;
    await searchBatchRow(r, radius);
    updateBatchRow(r);
    done++;
    setBatchProgress(done, todo.length, note + t("bSearching")(done, todo.length));
  });
  const ok = batch.rows.filter((r) => r.status === "done").length;
  setBatchProgress(1, 1, note + (batch.stopped ? t("bStopped") : t("bDone")(batch.rows.length, ok)));
  batch.running = false;
  $("bgo").disabled = false; $("bstop").classList.add("hidden"); $("bcsv").disabled = ok === 0;
}

function batchCsv() {
  const q = (v) => { v = v == null ? "" : String(v); return /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const head = ["input", "status", "resolved_name", "object_type", "ra_deg", "dec_deg", "total_observations"];
  MISSIONS.forEach((m) => head.push(`${m.key}_n`, `${m.key}_planned`, `${m.key}_exposure_ks`));
  CATMAN.catalogs.forEach((c) => head.push(`${c.key}_name`, `${c.key}_flux_${(c.unit || "mJy").replace(/[^\w]+/g, "")}`,
    `${c.key}_err_neg`, `${c.key}_err_pos`, `${c.key}_sep_arcsec`));
  const lines = [head.join(",")];
  for (const r of batch.rows) {
    const row = [r.input, r.status === "done" ? "ok" : r.status === "fail" ? "not_found" : r.status, r.main_id, r.otype,
      r.ra != null ? r.ra.toFixed(6) : "", r.dec != null ? r.dec.toFixed(6) : "", r.total];
    MISSIONS.forEach((m) => { const c = r.counts[m.key]; row.push(c ? c.n : "", c ? c.planned : "", c ? c.expo : ""); });
    CATMAN.catalogs.forEach((c) => {
      const x = r.cats[c.key], h = x && x.hits[0];
      row.push(h ? h.name : "", h ? h.flux : "", h ? h.eneg : "", h ? h.epos : "", h ? h.sep.toFixed(2) : "");
    });
    lines.push(row.map(q).join(","));
  }
  saveText("xray_batch_results.csv", lines.join("\n"));
}

function initBatch() {
  $("batchToggle").addEventListener("click", () => {
    $("batch").classList.toggle("hidden");
    if (!$("batch").classList.contains("hidden")) $("batch").scrollIntoView({behavior: "smooth", block: "start"});
  });
  $("bfile").addEventListener("change", async (ev) => {
    const f = ev.target.files[0];
    if (!f) return;
    $("btext").value = (await f.text()).slice(0, 2000000);
  });
  $("bgo").addEventListener("click", runBatch);
  $("bstop").addEventListener("click", () => { if (batch) batch.stopped = true; });
  $("bcsv").addEventListener("click", batchCsv);
  $("btable").addEventListener("click", (ev) => {
    const tr = ev.target.closest("tr.ok");
    if (!tr || !batch) return;
    const r = batch.rows[+tr.dataset.i];
    const q = r.main_id && !parseCoords(r.input) ? r.input : `${r.ra.toFixed(6)} ${r.dec >= 0 ? "+" : ""}${r.dec.toFixed(6)}`;
    $("q").value = q;
    search(q);
    $("form").scrollIntoView({behavior: "smooth", block: "start"});
  });
}

// ---------------------------------------------------------------- main
function syncUrl(q, radius) {
  const p = new URLSearchParams(location.search);
  p.set("q", q);
  if (radius) p.set("r", radius); else p.delete("r");
  history.replaceState(null, "", "?" + p.toString());
  if (window.self !== window.top) parent.postMessage({type: "xray-finder-query", q, r: radius || null}, "*");
}

async function search(q) {
  q = q.trim();
  if (!q || !MISSIONS.length) return;
  const sid = ++searchSeq;
  const fixed = document.querySelector("input[name=rmode]:checked").value === "fixed";
  const radius = fixed ? parseFloat($("radius").value) : null;
  if (fixed && !(radius > 0 && radius <= MAX_RADIUS)) { showStatus(t("radiusErr"), true); return; }
  syncUrl(q, radius);
  $("go").disabled = true;
  ["source", "results", "images", "catalogs", "xr", "spec"].forEach((id) => $(id).classList.add("hidden"));
  $("legend").innerHTML = "";
  showStatus(`<span class="spin"></span> ${esc(t("resolving")(q))}`);
  let src;
  try { src = await resolveSource(q); }
  catch (e) {
    if (sid === searchSeq) { showStatus(esc(t("notFound")) + esc(e.message), true); $("go").disabled = false; }
    return;
  }
  if (sid !== searchSeq) return;
  showStatus("");
  state = {id: sid, src, radius, results: {}, surveys: {}, sdss: null, cats: {}, pendingPlots: [], xrayPicked: false};
  renderSource(src);
  buildTable();
  renderTotal();
  $("results").classList.remove("hidden");
  showPanels(src, sid);
  runCatalogs(sid);
  showMap(src);
  runSurveys(sid);
  runSpectra(sid);
  await pool(MISSIONS.map((m) => m.key), 6, (k) => runMission(k, sid));
  if (sid === searchSeq) { $("go").disabled = false; runXr(sid); }
}

async function loadManifest() {
  MANIFEST = await getJSON(DATA + "manifest.json");
  MANIFEST.missions.forEach((m) => { m.cellSet = new Set(m.cells); });
  return MANIFEST;
}

(async function boot() {
  lang = pickLang();
  applyStatic();
  initMapControls();
  $("examples").innerHTML = EXAMPLES.map((e) => `<span class="chip" role="button" tabindex="0">${esc(e)}</span>`).join("");
  $("examples").addEventListener("click", (ev) => {
    if (!ev.target.classList.contains("chip")) return;
    $("q").value = ev.target.textContent; search($("q").value);
  });
  $("form").addEventListener("submit", (ev) => { ev.preventDefault(); search($("q").value); });
  $("hideZero").addEventListener("change", () => state && applyHideZero());
  $("csv").addEventListener("click", downloadCsv);
  document.querySelectorAll(".lang button").forEach((b) => b.addEventListener("click", () => setLang(b.dataset.lang)));
  const p = new URLSearchParams(location.search);
  if (p.get("r")) { document.querySelector("input[value=fixed]").checked = true; $("radius").value = p.get("r"); }
  if (p.get("q")) $("q").value = p.get("q");
  loadPlotly().catch(() => {});
  initBatch();
  initXrControls();
  ["spSel", "spBox", "spRest", "spLines", "spModel"].forEach((id) => $(id).addEventListener("change", drawSpectrum));
  $("spCsv").addEventListener("click", spectrumCsv);
  try {
    const [m] = await Promise.all([loadManifest(), loadCatManifest()]);
    MISSIONS = m.missions; SURVEYS = m.surveys;
    $("updated").textContent = t("updated")(m.updated);
  } catch (e) { showStatus(esc(t("noData")) + esc(e.message), true); return; }
  if (p.get("q")) search(p.get("q"));
  else if (window.self === window.top) $("q").focus();
})();
</script>
