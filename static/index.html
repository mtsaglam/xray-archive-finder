<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X-ray Archive Finder</title>
<script type="module">
import A from "https://cdn.jsdelivr.net/npm/aladin-lite@3.8.2/dist/aladin.js";
window.A = A;
</script>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #1b2430; --muted: #5e6b7a; --line: #e2e6eb;
  --accent: #1f5fae; --accent-ink: #ffffff; --soft: #eef3fa; --ok: #1e7a46; --warn: #a15c00; --bad: #b3261e;
  --zero: #9aa5b1;
}
@media (prefers-color-scheme: dark) {
  :root:not(.embedded) {
    --bg: #12161c; --card: #1a2029; --ink: #e6eaef; --muted: #9aa6b4; --line: #2b3440;
    --accent: #6ea8ff; --accent-ink: #0b1220; --soft: #1f2a3a; --ok: #5fcf8f; --warn: #f0b45a; --bad: #ff8a80;
    --zero: #5b6672;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.embedded body { background: transparent; }
a { color: var(--accent); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 24px 16px 60px; }
.embedded .wrap { padding: 0 0 8px; }
.embedded header { display: none; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
header h1 { margin: 0; font-size: 26px; letter-spacing: -.01em; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
.lang button { border: 0; border-radius: 0; padding: 4px 10px; font-size: 13px; background: var(--card); color: var(--muted); }
.lang button.on { background: var(--accent); color: var(--accent-ink); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-top: 16px; }
.embedded .card:first-of-type { margin-top: 0; }
.card h2 { margin: 0 0 12px; font-size: 17px; }
.search { display: flex; gap: 8px; flex-wrap: wrap; }
.search input[type=text] { flex: 1 1 320px; min-width: 0; padding: 11px 13px; font-size: 16px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.search input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button { font: inherit; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 12px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: 10px 22px; font-weight: 600; }
button:disabled { opacity: .55; cursor: default; }
.opts { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 12px; color: var(--muted); font-size: 14px; align-items: center; }
.opts label { display: inline-flex; gap: 6px; align-items: center; }
.opts input[type=number] { width: 72px; padding: 4px 6px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { font-size: 13px; padding: 3px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); cursor: pointer; color: var(--ink); }
.muted { color: var(--muted); }
.err { color: var(--bad); }
.src-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px 20px; }
.kv .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.kv .v { font-size: 15px; font-variant-numeric: tabular-nums; word-break: break-word; }
.big { font-size: 20px; font-weight: 650; }
details.aliases { margin-top: 12px; }
details.aliases summary { cursor: pointer; color: var(--accent); }
.alias-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; max-height: 220px; overflow: auto; }
.alias-list span { font-size: 12.5px; padding: 2px 8px; border-radius: 6px; background: var(--soft); }
.total { display: flex; gap: 28px; flex-wrap: wrap; margin-bottom: 12px; }
.total .n { font-size: 30px; font-weight: 700; line-height: 1.1; }
.total .l { color: var(--muted); font-size: 13px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; margin: 0; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
td.num, th.num { text-align: right; }
tr.mrow { cursor: pointer; }
tr.mrow:hover td { background: var(--soft); }
tr.mrow.zero td { color: var(--zero); }
tr.mrow.zero { cursor: default; }
tr.mrow .count { font-weight: 700; font-size: 16px; }
tr.mrow .caret { display: inline-block; width: 14px; color: var(--muted); transition: transform .15s; }
tr.mrow.open .caret { transform: rotate(90deg); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; vertical-align: 1px; }
tr.detail > td { padding: 0 0 12px 24px; background: var(--bg); white-space: normal; }
tr.detail table { font-size: 13px; }
tr.detail th, tr.detail td { padding: 5px 8px; }
.badge { font-size: 11.5px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; }
.b-ok { color: var(--ok); } .b-warn { color: var(--warn); } .b-plan { color: var(--muted); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s .8s linear infinite; vertical-align: -2px; }
@keyframes s { to { transform: rotate(360deg); } }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.surveys { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 14px; }
.survey { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.two { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 16px; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; } }
#aladin { width: 100%; height: 460px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #000; }
.mapctl { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 10px; font-size: 14px; align-items: center; }
.mapctl select { padding: 5px 6px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); max-width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; margin-top: 8px; color: var(--muted); }
.note { font-size: 13px; margin: 10px 0 0; }
footer { margin-top: 28px; color: var(--muted); font-size: 12.5px; }
.panels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 860px) { .panels { grid-template-columns: 1fr; } }
.panel .ph { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 6px; }
.panel .ph b { font-size: 14px; }
.panel select { padding: 4px 5px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); max-width: 62%; font-size: 13px; }
.panel .view { width: 100%; aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; border: 1px solid var(--line); background: #000; }
.panel .pnote { font-size: 12px; color: var(--muted); margin-top: 5px; min-height: 1.4em; }
table.cat td { white-space: normal; vertical-align: top; }
table.cat td.flux { white-space: nowrap; font-weight: 600; }
table.cat .params { font-size: 12.5px; color: var(--muted); }
table.cat tr.nomatch td { color: var(--zero); }
.subhead { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 6px; }
.subhead:first-of-type { margin-top: 0; }
.batch textarea { width: 100%; min-height: 110px; padding: 10px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
.batch .row { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-top: 10px; }
.batch ul { margin: 6px 0 0; padding-left: 20px; color: var(--muted); font-size: 13.5px; }
.batch code { background: var(--soft); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
.progress { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden; flex: 1 1 200px; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
table.btab { font-size: 13px; }
table.btab th, table.btab td { padding: 5px 7px; }
table.btab tr.ok { cursor: pointer; }
table.btab tr.ok:hover td { background: var(--soft); }
table.btab td.z { color: var(--zero); }
.plot { width: 100%; min-height: 320px; }
.plot.sq { max-width: 640px; aspect-ratio: 1 / 1; min-height: 0; }
.plot.wide { height: 440px; }
.plots2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-bottom: 4px; }
@media (max-width: 860px) { .plots2 { grid-template-columns: 1fr; } }
.row.dl { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 10px; }
.hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="title"></h1>
      <p data-i18n="subtitle"></p>
    </div>
  </header>

  <section class="card">
    <form class="search" id="form" autocomplete="off">
      <input type="text" id="q" data-i18n-ph="placeholder" aria-label="Source">
      <button class="primary" id="go" type="submit" data-i18n="search"></button>
    </form>
    <div class="opts">
      <span data-i18n="radius"></span>
      <label><input type="radio" name="rmode" value="auto" checked> <span data-i18n="radiusAuto"></span></label>
      <label><input type="radio" name="rmode" value="fixed"> <span data-i18n="radiusFixed"></span>
        <input type="number" id="radius" value="5" min="0.1" max="300" step="0.5"> <span data-i18n="arcmin"></span></label>
      <button type="button" id="batchToggle" data-i18n="batchToggle"></button>
      <span class="lang" style="margin-left:auto"><button type="button" data-lang="en">EN</button><button type="button" data-lang="tr">TR</button></span>
    </div>
    <div class="chips" id="examples"></div>
  </section>

  <section id="batch" class="card batch hidden">
    <h2 data-i18n="batchTitle"></h2>
    <div class="muted" style="font-size:14px" data-i18n="batchIntro"></div>
    <ul>
      <li><span data-i18n="fmtName"></span> <code>Cyg X-1</code> <code>Mrk 421</code> <code>4U 1820-30</code></li>
      <li><span data-i18n="fmtDeg"></span> <code>299.5903 35.2016</code> <code>299.5903, +35.2016</code></li>
      <li><span data-i18n="fmtSexa"></span> <code>19 58 21.67 +35 12 05.7</code> <code>19:58:21.67 +35:12:05.7</code> <code>19h58m21.67s +35d12m05.7s</code></li>
      <li data-i18n="fmtSkip"></li>
    </ul>
    <div class="row">
      <input type="file" id="bfile" accept=".txt,.csv,.tsv,.dat,.list,text/plain,text/csv">
      <span class="muted" style="font-size:13px" data-i18n="orPaste"></span>
    </div>
    <textarea id="btext" spellcheck="false" placeholder="Cyg X-1&#10;Mrk 421&#10;299.5903 35.2016&#10;17:45:40.04 -29:00:28.2"></textarea>
    <div class="row">
      <button class="primary" id="bgo" type="button" data-i18n="batchRun"></button>
      <button id="bstop" type="button" class="hidden" data-i18n="batchStop"></button>
      <button id="bcsv" type="button" disabled data-i18n="csv"></button>
      <div class="progress"><div id="bbar"></div></div>
      <span id="bstatus" class="muted" style="font-size:13px"></span>
    </div>
    <div class="tablewrap" style="margin-top:12px"><table class="btab" id="btable"></table></div>
    <p class="muted note" data-i18n="batchNote"></p>
  </section>

  <div id="status" class="card hidden"></div>

  <section id="source" class="card hidden"></section>

  <section id="results" class="card hidden">
    <div class="toolbar">
      <h2 style="margin:0" data-i18n="obsTitle"></h2>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
        <label class="muted" style="font-size:14px"><input type="checkbox" id="hideZero"> <span data-i18n="hideZero"></span></label>
        <button id="csv" disabled data-i18n="csv"></button>
      </div>
    </div>
    <div class="total" id="total"></div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th data-i18n="thMission"></th><th class="num" data-i18n="thObs"></th><th class="num" data-i18n="thPlanned"></th>
          <th class="num" data-i18n="thProp"></th><th class="num" data-i18n="thExpo"></th><th data-i18n="thRange"></th>
          <th class="num" data-i18n="thRadius"></th>
        </tr></thead>
        <tbody id="mtable"></tbody>
      </table>
    </div>
    <p class="muted note" data-i18n="tableNote"></p>
    <div class="surveys" id="surveys"></div>
  </section>

  <section id="images" class="card hidden">
    <h2 data-i18n="imgTitle"></h2>
    <div class="panels">
      <div class="panel" data-band="opt"><div class="ph"><b data-i18n="pOpt"></b><select></select></div><div class="view" id="v-opt"></div><div class="pnote"></div></div>
      <div class="panel" data-band="x"><div class="ph"><b data-i18n="pX"></b><select></select></div><div class="view" id="v-x"></div><div class="pnote"></div></div>
      <div class="panel" data-band="radio"><div class="ph"><b data-i18n="pRadio"></b><select></select></div><div class="view" id="v-radio"></div><div class="pnote"></div></div>
    </div>
    <p class="muted note" data-i18n="imgNote"></p>
  </section>

  <section id="xr" class="card hidden">
    <h2 data-i18n="xrTitle"></h2>
    <div class="mapctl">
      <label><span data-i18n="xrImage"></span> <select id="xrX"></select></label>
      <label><span data-i18n="xrContours"></span> <select id="xrR"></select></label>
      <label><span data-i18n="xrFov"></span> <select id="xrFov"><option>1</option><option>2</option><option>4</option><option>8</option><option>15</option><option>30</option></select>′</label>
      <label><span data-i18n="xrSmooth"></span> <input type="range" id="xrSig" min="0" max="40" step="0.5" value="2"> <span id="xrSigV"></span>″</label>
      <label><span data-i18n="xrStretch"></span> <select id="xrStr"><option value="asinh">asinh</option><option value="log">log</option><option value="sqrt">sqrt</option><option value="linear">linear</option></select></label>
      <label><span data-i18n="xrLevels"></span> <select id="xrLev"><option value="3">3σ</option><option value="5">5σ</option><option value="10">10σ</option><option value="0">—</option></select></label>
    </div>
    <div id="xrPlot" class="plot sq"></div>
    <div class="row dl">
      <button type="button" id="xrPng" data-i18n="dlPng"></button>
      <button type="button" id="xrFitsX" data-i18n="dlFitsX"></button>
      <button type="button" id="xrFitsR" data-i18n="dlFitsR"></button>
      <span id="xrStatus" class="muted" style="font-size:13px"></span>
    </div>
    <p class="muted note" id="xrInfo"></p>
    <p class="muted note" data-i18n="xrNote"></p>
  </section>

  <section id="catalogs" class="card hidden">
    <h2 data-i18n="catTitle"></h2>
    <div class="plots2">
      <div><div class="subhead" data-i18n="fxTitle"></div><div id="fxPlot" class="plot"></div></div>
      <div><div class="subhead" data-i18n="frTitle"></div><div id="frPlot" class="plot"></div></div>
    </div>
    <p class="muted note" data-i18n="fluxPlotNote"></p>
    <div class="subhead" data-i18n="catX"></div>
    <div class="tablewrap"><table class="cat" id="catx"></table></div>
    <div class="subhead" data-i18n="catRadio"></div>
    <div class="tablewrap"><table class="cat" id="catr"></table></div>
    <p class="muted note" data-i18n="catNote"></p>
  </section>

  <section id="spec" class="card hidden">
    <h2 data-i18n="sdssTitle"></h2>
    <div id="sdss" class="muted">—</div>
    <div id="specCtl" class="mapctl hidden" style="margin-top:8px">
      <label><span data-i18n="spWhich"></span> <select id="spSel"></select></label>
      <label><span data-i18n="spSmooth"></span> <select id="spBox"><option value="1">—</option><option value="3">3 px</option><option value="5" selected>5 px</option><option value="9">9 px</option><option value="15">15 px</option></select></label>
      <label><input type="checkbox" id="spRest"> <span data-i18n="spRest"></span></label>
      <label><input type="checkbox" id="spLines" checked> <span data-i18n="spLines"></span></label>
      <label><input type="checkbox" id="spModel" checked> <span data-i18n="spModel"></span></label>
      <button type="button" id="spCsv" data-i18n="dlCsv"></button>
    </div>
    <div id="spPlot" class="plot wide hidden"></div>
    <p class="muted note" id="spInfo"></p>
  </section>

  <div class="hidden" id="extras">
    <section class="card">
      <h2 data-i18n="fieldTitle"></h2>
      <div class="mapctl">
        <label><span data-i18n="base"></span> <select id="base"></select></label>
        <label><span data-i18n="overlay"></span> <select id="overlay"></select></label>
        <label><span data-i18n="opacity"></span> <input type="range" id="opacity" min="0" max="100" value="50"></label>
        <label><input type="checkbox" id="showPts" checked> <span data-i18n="points"></span></label>
      </div>
      <div id="aladin"></div>
      <div class="legend" id="legend"></div>
      <p class="muted note" data-i18n="mapNote"></p>
    </section>
  </div>

  <footer><span data-i18n="footer"></span> <span id="updated"></span></footer>
</div>

<script>
"use strict";
const DATA = window.XRAY_DATA_BASE || "data/";
const SIMBAD_MIRRORS = ["https://simbad.cds.unistra.fr/simbad", "https://simbad.cfa.harvard.edu/simbad", "https://simbad.idia.ac.za/simbad"];
const SESAME = "https://cds.unistra.fr/cgi-bin/nph-sesame/-oxp/SNV?";
const SDSS_BASE = "https://skyserver.sdss.org/dr17";
const MAX_RADIUS = 300;
const COLORS = ["#e6194b","#3cb44b","#4363d8","#f58231","#911eb4","#42d4f4","#f032e6","#bfef45","#fabed4",
  "#469990","#dcbeff","#9a6324","#fffac8","#800000","#aaffc3","#808000","#ffd8b1","#000075"];
const EXAMPLES = ["Cyg X-1", "Mrk 421", "Sgr A*", "4U 1820-30", "Crab", "Ton 618", "19 58 21.67 +35 12 05.7"];

const I18N = {
  en: {
    title: "X-ray Archive Finder",
    subtitle: "Finds how many observations a source has with each X-ray mission, from the NASA HEASARC archive. Names are resolved with SIMBAD.",
    placeholder: "Source name (Cyg X-1, Mrk 421, 4U 1820-30…) or coordinates (19 58 21.7 +35 12 06 / 299.59 35.20)",
    search: "Search", radius: "Search radius:", radiusAuto: "Automatic (each mission's field of view)",
    radiusFixed: "Fixed", arcmin: "arcmin",
    coordTitle: "Coordinates: ", query: "query", resolver: "resolved by", simbadPage: "SIMBAD page",
    nearest: "Nearest SIMBAD object", noneWithin: "none within 10″", allNames: "All names",
    galactic: "Galactic l, b",
    obsTitle: "X-ray observations", hideZero: "Hide missions without observations", csv: "Download CSV",
    thMission: "Mission", thObs: "Observations", thPlanned: "Planned / not done", thProp: "Still proprietary",
    thExpo: "Total exposure (ks)", thRange: "First – last", thRadius: "Radius (′)",
    totObs: "observations", totMissions: "missions", totExpo: "total exposure (Ms)", pending: (n) => `${n} missions pending…`,
    tableNote: "Click a row to list its observations. “Observations” counts performed ones (archived, processing or still proprietary) whose pointing centre lies within the radius; use the offset column to spot off-axis pointings. For INTEGRAL the radius is 5° (IBIS field of view) and the count is per observation ID, with the number of science windows (ScW) shown below.",
    retry: "Error ↻",
    dId: "ObsID", dTarget: "Target", dDate: "Date", dExpo: "Exposure (ks)", dOff: "Offset (′)", dStatus: "Status",
    planned: "planned", proprietary: "proprietary →", archived: "archived",
    firstN: (n, t) => `Showing the first ${n} of ${t} observations; download the CSV for all of them.`,
    covered: "✔ Covered", notCovered: "✘ Not covered", fields: "field",
    outside_dr1: "eRASS1 DR1 only covers the half of the sky with Galactic longitude 180° < l < 360° (German consortium).",
    fieldTitle: "Layered map and observation pointings", base: "Image", overlay: "Overlay", opacity: "Opacity", points: "Pointings", none: "— none —",
    imgTitle: "Images", pOpt: "Optical", pX: "X-ray", pRadio: "Radio",
    imgNote: "The three panels move and zoom together; drag or scroll in any of them. The X-ray panel picks Chandra or XMM-Newton when this source has observations with them, otherwise the eROSITA or ROSAT survey; the radio panel picks the best survey covering this declination. Change any panel from its menu.",
    pickedBecause: {chandra: "Chandra observations exist for this source", xmm: "XMM-Newton observations exist for this source", erosita: "eROSITA all-sky survey (DR1)", rass: "ROSAT all-sky survey", radio: "covers this declination", fallback: "no better image reachable right now"},
    noXrayObs: "No Chandra or XMM-Newton observation of this source; showing an all-sky survey.",
    catTitle: "Catalogue fluxes", catX: "X-ray source catalogues", catRadio: "Radio source catalogues",
    cCat: "Catalogue", cBand: "Band", cFlux: "Flux", cSep: "Sep. (″)", cName: "Name", cParams: "Other parameters", cPosErr: "pos. err",

// ---------------------------------------------------------------- language / embedding
function pickLang() {
  const p = new URLSearchParams(location.search).get("lang");
  if (p && I18N[p]) return p;
  try { const s = localStorage.getItem("xray-finder-lang"); if (s && I18N[s]) return s; } catch (e) { /* no storage */ }
  return (navigator.language || "").toLowerCase().startsWith("tr") ? "tr" : "en";
}

function applyStatic() {
  document.documentElement.lang = lang;
  document.title = t("title");
  document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll(".lang button").forEach((b) => b.classList.toggle("on", b.dataset.lang === lang));
  buildMapSelects();
}

function setLang(l) {
  lang = l;
  try { localStorage.setItem("xray-finder-lang", l); } catch (e) { /* no storage */ }
  applyStatic();
  renderBatch();
  if (MANIFEST) $("updated").textContent = t("updated")(MANIFEST.updated);
  if (!state) return;
  renderSource(state.src);
  MISSIONS.forEach((m) => {
    const det = $("det-" + m.key);
    const wasOpen = !det.classList.contains("hidden");
    delete det.dataset.filled; det.classList.add("hidden"); $("row-" + m.key).classList.remove("open");
    if (state.results[m.key]) renderRow(m.key);
    if (wasOpen) toggleDetail(m.key);
  });
  renderTotal();
  renderSurveys();
  if (state.spec && state.spec.list && state.spec.list.length) drawSpectrum();
  else if (!$("spec").classList.contains("hidden")) renderSpecList();
  renderCatalogs();
  scheduleFluxPlots();
  if (state.xr && state.xr.xc) { fillCutSelects(); drawXr(); }
}

if (window.self !== window.top) {
  document.documentElement.classList.add("embedded");
  const post = () => parent.postMessage({type: "xray-finder-height", height: document.documentElement.scrollHeight}, "*");
  new ResizeObserver(post).observe(document.body);
  window.addEventListener("load", post);
}

  const r = await fetch(url);
  let body = null;
  try { body = await r.json(); } catch (e) { /* non-JSON */ }
  if (!r.ok) { const err = new Error((body && body.error) || ("HTTP " + r.status)); err.status = r.status; throw err; }
  return body;
}

async function pool(items, limit, fn) {
  let i = 0;
  const workers = Array.from({length: Math.min(limit, items.length)}, async () => {
    while (i < items.length) { const it = items[i++]; await fn(it); }
  });
  await Promise.all(workers);
}

function showStatus(html, isErr) {
  const el = $("status");
  el.innerHTML = html;
  el.classList.toggle("hidden", !html);
  el.classList.toggle("err", !!isErr);
}

async function fetchTimeout(url, ms, opts) {
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, Object.assign({signal: ctl.signal}, opts || {})); }
  finally { clearTimeout(timer); }
}

// ---------------------------------------------------------------- astronomy helpers
const D2R = Math.PI / 180;
const todayMjd = () => Date.now() / 86400000 + 40587;
const mjdToDate = (m) => (m == null ? null : new Date((m - 40587) * 86400000).toISOString().slice(0, 10));

function sepDeg(ra1, de1, ra2, de2) {
  const s = Math.sin((de2 - de1) * D2R / 2) ** 2 + Math.cos(de1 * D2R) * Math.cos(de2 * D2R) * Math.sin((ra2 - ra1) * D2R / 2) ** 2;
  return 2 * Math.asin(Math.min(1, Math.sqrt(s))) / D2R;
}

function toGalactic(ra, dec) {
  const R = [[-0.0548755604162154, -0.8734370902348850, -0.4838350155487132],
             [0.4941094278755837, -0.4448296299600112, 0.7469822444972189],
             [-0.8676661490190047, -0.1980763734312015, 0.4559837761750669]];
  const v = [Math.cos(dec * D2R) * Math.cos(ra * D2R), Math.cos(dec * D2R) * Math.sin(ra * D2R), Math.sin(dec * D2R)];
  const g = R.map((row) => row[0] * v[0] + row[1] * v[1] + row[2] * v[2]);
  let l = Math.atan2(g[1], g[0]) / D2R;
  if (l < 0) l += 360;
  return [l, Math.asin(Math.max(-1, Math.min(1, g[2]))) / D2R];
}

function sexa(x, hours, prec) {
  const sign = x < 0 ? "-" : (hours ? "" : "+");
  let v = Math.abs(hours ? x / 15 : x);
  let a = Math.floor(v), b = Math.floor((v - a) * 60), c = ((v - a) * 60 - b) * 60;
  c = Number(c.toFixed(prec));
  if (c >= 60) { c -= 60; b += 1; }
  if (b >= 60) { b -= 60; a += 1; }
  const p2 = (n) => String(n).padStart(2, "0");
  return `${sign}${p2(a)}:${p2(b)}:${c.toFixed(prec).padStart(prec + 3, "0")}`;
}

function parseCoords(text) {
  const tx = text.trim();
  if (!/^[\s0-9+\-.:,hmsd°'"]+$/i.test(tx) || !/\d/.test(tx)) return null;
  const plain = tx.replace(/,/g, " ").trim().split(/\s+/);
  let ra, dec;
  if (plain.length === 2 && plain.every((p) => /^[+-]?\d+(\.\d*)?$/.test(p))) {
    ra = parseFloat(plain[0]); dec = parseFloat(plain[1]);
  } else {
    const tk = tx.replace(/[hmsd°'":,]/gi, " ").trim().split(/\s+/);
    if (tk.length !== 6 || !tk.every((p) => /^[+-]?\d+(\.\d*)?$/.test(p))) return null;
    const n = tk.map(Number);
    if (n[1] >= 60 || n[2] >= 60 || n[4] >= 60 || n[5] >= 60) return null;
    ra = (Math.abs(n[0]) + n[1] / 60 + n[2] / 3600) * 15;
    dec = (Math.abs(n[3]) + n[4] / 60 + n[5] / 3600) * (tk[3].startsWith("-") ? -1 : 1);
  }
  if (!(ra >= 0 && ra < 360 && dec >= -90 && dec <= 90)) return null;
  return {ra, dec};
}

// ---------------------------------------------------------------- name resolution (SIMBAD, Sesame fallback)
const SIMBAD_FMT = 'format object "%MAIN_ID|%COO(d;A D)|%OTYPE(V)|%IDLIST[%*;]"';

// All mirrors are asked at once and the first valid answer wins, so one mirror being down costs nothing.
async function simbadScript(body, timeout) {
  const script = "output console=off script=off\n" + SIMBAD_FMT + "\n" + body;
  const ask = async (base) => {
    const r = await fetchTimeout(base + "/sim-script", timeout || 25000, {method: "POST", body: new URLSearchParams({script})});
    if (!r.ok) throw new Error("HTTP " + r.status);
    const txt = await r.text();
    if (/<html/i.test(txt.slice(0, 500))) throw new Error("not SIMBAD");
    return {base, txt};
  };
  try { return await Promise.any(SIMBAD_MIRRORS.map(ask)); } catch (e) { return null; }
}

function parseSimbadLine(line) {
  const p = line.split("|");
  if (p.length < 4) return null;
  const c = p[1].trim().split(/\s+/);
  if (c.length !== 2 || isNaN(+c[0]) || isNaN(+c[1]) || c[0] === "") return null;
  return {main_id: p[0].trim().replace(/\s+/g, " "), ra: +c[0], dec: +c[1], otype: p[2].trim(),
    aliases: p[3].split(";").map((a) => a.trim().replace(/\s+/g, " ")).filter(Boolean)};
}

function dataLines(txt) {
  let inError = false;
  return txt.split("\n").filter((line) => {
    if (line.startsWith("::error")) { inError = true; return false; }
    if (line.startsWith("::data")) { inError = false; return false; }
    return !inError && line.includes("|");
  });
}

function parseSimbad(txt) {
  if (txt.includes("::error::")) return [];
  return dataLines(txt).map(parseSimbadLine).filter(Boolean);
}

// Results of a multi-line "query id" script: failed queries are listed by script line number
// (line 1 = output, line 2 = format, so query k is on line k + 3); the rest come back in order.
function parseSimbadBatch(txt, n) {
  const failed = new Set([...txt.matchAll(/^\[(\d+)\]/gm)].map((m) => +m[1] - 3));
  const data = dataLines(txt);
  const out = [];
  let k = 0;
  for (let i = 0; i < n; i++) out.push(failed.has(i) ? null : parseSimbadLine(data[k++] || ""));
  return out;
}

async function sesame(name) {
  try {
    const r = await fetchTimeout(SESAME + encodeURIComponent(name), 25000);
    const x = await r.text();
    const g = (tag) => { const m = x.match(new RegExp(`<${tag}>([^<]+)</${tag}>`)); return m ? m[1].trim() : null; };
    const ra = g("jradeg"), dec = g("jdedeg");
    if (ra == null || dec == null) return null;
    const res = x.match(/<Resolver name="([^"]+)"/);
    return {main_id: g("oname") || name, ra: +ra, dec: +dec, otype: g("otype") || "", aliases: [],
      resolver: res ? res[1] : "Sesame"};
  } catch (e) { return null; }
}

async function resolveSource(q) {
  q = q.replace(/[\r\n]+/g, " ").replace(/\s+/g, " ").trim();
  const out = {query: q};
  const c = parseCoords(q);
  if (c) {
    Object.assign(out, {input_type: "coord", ra: c.ra, dec: c.dec, main_id: null, otype: null, aliases: [], resolver: "coordinates"});
    const s = await simbadScript(`query coo ${c.ra.toFixed(7)} ${c.dec >= 0 ? "+" : ""}${c.dec.toFixed(7)} radius=10s`);
    const objs = s ? parseSimbad(s.txt).map((o) => Object.assign(o, {sep_arcsec: sepDeg(c.ra, c.dec, o.ra, o.dec) * 3600})) : [];
    out.nearest = objs.sort((a, b) => a.sep_arcsec - b.sep_arcsec)[0] || null;
  } else {
    let obj = null;
    const s = await simbadScript("query id " + q);
    if (s) {
      obj = parseSimbad(s.txt)[0] || null;
      if (obj) { obj.resolver = "SIMBAD"; out.simbad_url = s.base + "/sim-id?Ident=" + encodeURIComponent(obj.main_id); }
    }
    if (!obj) obj = await sesame(q);
    if (!obj) throw new Error(`'${q}' (SIMBAD/NED/VizieR)`);
    Object.assign(out, {input_type: "name"}, obj);
  }
  out.ra_hms = sexa(out.ra, true, 2);
  out.dec_dms = sexa(out.dec, false, 1);
  [out.l, out.b] = toGalactic(out.ra, out.dec);
  return out;
}

// ---------------------------------------------------------------- observation index (static sky cells)
let MANIFEST = null;
const cellCache = new Map();

function cellsForCircle(ra, dec, r) {
  const size = MANIFEST.cell_deg, nRa = MANIFEST.n_ra, nDec = MANIFEST.n_dec;
  const lo = Math.max(-90, dec - r), hi = Math.min(90, dec + r);
  const iLo = Math.floor((lo + 90) / size), iHi = Math.min(nDec - 1, Math.floor((hi + 90) / size));
  const maxAbs = Math.max(Math.abs(lo), Math.abs(hi));
  const halfW = maxAbs >= 89.5 ? 180 : r / Math.cos(maxAbs * D2R) + 1e-6;
  const out = [];
  for (let i = iLo; i <= iHi; i++) {
    if (halfW >= 180) { for (let j = 0; j < nRa; j++) out.push(i * nRa + j); continue; }
    const jLo = Math.floor((ra - halfW) / size), jHi = Math.floor((ra + halfW) / size);
    for (let j = jLo; j <= jHi; j++) out.push(i * nRa + (((j % nRa) + nRa) % nRa));
  }
  return [...new Set(out)];
}

function loadCell(key, idx) {
  const url = `${DATA}${key}/${idx}.json`;
  if (!cellCache.has(url)) {
    const p = getJSON(url);
    p.catch(() => cellCache.delete(url));
    cellCache.set(url, p);
    if (cellCache.size > 3000) cellCache.delete(cellCache.keys().next().value);
  }
  return cellCache.get(url);
}

// ---------------------------------------------------------------- source catalogues (static cells + live VizieR)
let CATMAN = null;

async function loadCatManifest() {
  try {
    CATMAN = await getJSON(DATA + "cat/manifest.json");
    CATMAN.catalogs.forEach((c) => { c.cellSet = new Set(c.cells); });
  } catch (e) { CATMAN = {catalogs: []}; }
}

function inDec(range, dec) { return !range || (dec >= range[0] && dec <= range[1]); }

function catCoverage(c, ra, dec) {
  if (c.key === "erass1") { const l = toGalactic(ra, dec)[0]; return l > 179.9442 && l < 359.9442; }
  return inDec(CAT_DEC_COVER[c.key], dec);
}

async function queryCatalog(c, ra, dec) {
  const r = c.match / 3600;
  const idxs = cellsForCircle(ra, dec, r).filter((i) => c.cellSet.has(i));
  const cells = await Promise.all(idxs.map((i) => loadCell("cat/" + c.key, i)));
  const hits = [];
  for (const rows of cells) for (const row of rows) {
    const sep = sepDeg(ra, dec, row[0], row[1]) * 3600;
    if (sep <= c.match) hits.push({sep, ra: row[0], dec: row[1], name: row[2], poserr: row[3], flux: row[4],
      eneg: row[5], epos: row[6], params: row.slice(7)});
  }
  hits.sort((a, b) => a.sep - b.sep);
  return {cat: c, hits, covered: catCoverage(c, ra, dec)};
}

function parseVizierTsv(txt) {
  const lines = txt.split("\n").filter((l) => l && !l.startsWith("#"));
  if (lines.length < 3) return [];
  const head = lines[0].split("\t").map((h) => h.trim());
  return lines.slice(3).map((l) => {
    const v = l.split("\t");
    return Object.fromEntries(head.map((h, i) => [h, (v[i] || "").trim()]));
  });
}

async function queryVizier(c, ra, dec) {
  const covered = inDec(c.dec, dec);
  if (!covered) return {cat: c, hits: [], covered};
  const qs = new URLSearchParams({"-source": c.src, "-c": `${ra.toFixed(6)} ${dec >= 0 ? "+" : ""}${dec.toFixed(6)}`,
    "-c.rs": String(c.match), "-out": `${c.name},${c.flux},${c.err}`, "-out.add": "_r,_RAJ,_DEJ", "-sort": "_r", "-out.max": "20"});
  const ask = async (base) => {
    const r = await fetchTimeout(`${base}/viz-bin/asu-tsv?${qs}`, 30000);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const txt = await r.text();
    if (!txt.includes("#")) throw new Error("not VizieR");
    return parseVizierTsv(txt);
  };
  const rows = await Promise.any(VIZIER_MIRRORS.map(ask)).catch(() => { throw new Error("VizieR unreachable"); });
  const scale = c.scale || 1, seen = new Set(), hits = [];
  for (const r of rows) {
    if (seen.has(r[c.name])) continue;
    seen.add(r[c.name]);
    const f = parseFloat(r[c.flux]), e = parseFloat(r[c.err]);
    hits.push({sep: parseFloat(r._r), ra: parseFloat(r._RAJ2000), dec: parseFloat(r._DEJ2000), name: r[c.name],
      flux: isNaN(f) ? null : f * scale, eneg: isNaN(e) ? null : e * scale, epos: isNaN(e) ? null : e * scale, params: []});
  }
  return {cat: c, hits, covered};
}

async function queryMission(m, ra, dec, radiusArcmin) {
  const r = radiusArcmin / 60;
  const idxs = cellsForCircle(ra, dec, r).filter((i) => m.cellSet.has(i));
  const cells = await Promise.all(idxs.map((i) => loadCell(m.key, i)));
  const done = new Set(MANIFEST.done_statuses), now = todayMjd();
  let obs = [];
  for (const rows of cells) for (const row of rows) {
    const off = sepDeg(ra, dec, row[0], row[1]);
    if (off > r) continue;
    if (m.grouped) { obs.push({ra: row[0], dec: row[1], id: row[2], mjd: row[3], expo: row[4], off}); continue; }
    const status = m.statuses[row[6]] || "";
    const isDone = done.has(status), pub = row[7];
    const extra = {};
    m.extra_keys.forEach((k, n) => { const v = row[8 + n]; if (v != null && v !== "") extra[k] = v; });
    obs.push({id: row[2], name: row[5], mjd: row[3], date: mjdToDate(row[3]),
      exposure_ks: row[4] == null ? null : Math.round(row[4] / 10) / 100, offset_arcmin: Math.round(off * 6000) / 100,
      status: status || (isDone ? "archived" : ""), done: isDone, proprietary: isDone && pub != null && pub > now,
      public_date: pub ? mjdToDate(pub) : null, ra: row[0], dec: row[1], extra,
      link: m.link && isDone ? m.link.replace("{id}", row[2]) : null});
  }
  let nScw = null;
  if (m.grouped) {
    const groups = new Map();
    for (const s of obs) {
      const g = groups.get(s.id) || {id: s.id, n: 0, mjd: Infinity, expo: 0, off: Infinity, ra: 0, dec: 0};
      g.n++; g.mjd = Math.min(g.mjd, s.mjd); g.expo += s.expo || 0; g.off = Math.min(g.off, s.off); g.ra += s.ra; g.dec += s.dec;
      groups.set(s.id, g);
    }
    nScw = obs.length;
    obs = [...groups.values()].map((g) => ({id: g.id, name: "", mjd: g.mjd, date: mjdToDate(g.mjd),
      exposure_ks: Math.round(g.expo / 10) / 100, offset_arcmin: Math.round(g.off * 6000) / 100, status: "archived",
      done: true, proprietary: false, public_date: null, ra: g.ra / g.n, dec: g.dec / g.n, extra: {ScW: g.n}, link: null}));
  }
  obs.sort((a, b) => (a.mjd == null) - (b.mjd == null) || (a.mjd || 0) - (b.mjd || 0));
  const doneObs = obs.filter((o) => o.done);
  const dates = doneObs.map((o) => o.date).filter(Boolean).sort();
  return {key: m.key, label: m.label, radius_arcmin: radiusArcmin,
    n_done: doneObs.length, n_planned: obs.length - doneObs.length, n_proprietary: obs.filter((o) => o.proprietary).length,
    n_scw: nScw, exposure_ks: Math.round(doneObs.reduce((a, o) => a + (o.exposure_ks || 0), 0) * 10) / 10,
    expo_note: m.expo_note, first: dates[0] || null, last: dates[dates.length - 1] || null, observations: obs};
}

let surveysData = null;
async function querySurvey(key, ra, dec) {
  if (!surveysData) surveysData = getJSON(DATA + "surveys.json").catch((e) => { surveysData = null; throw e; });
  const d = await surveysData;
  if (key === "erass1") {
    const l = toGalactic(ra, dec)[0];
    const inHalf = l > 179.9442 && l < 359.9442;
    const tiles = inHalf ? d.erass1.filter(([, r0, r1, d0, d1]) =>
      dec >= d0 && dec <= d1 && ((ra - r0) % 360 + 360) % 360 <= ((r1 - r0) % 360 + 360) % 360).map((x) => x[0]) : [];
    return {covered: tiles.length > 0, fields: tiles, note: tiles.length ? null : "outside_dr1"};
  }
  const fields = d.rass.filter(([, fr, fd]) =>
    Math.abs((((ra - fr + 180) % 360) + 360) % 360 - 180) * Math.cos(dec * D2R) <= 3.2 && Math.abs(dec - fd) <= 3.2).map((x) => x[0]);
  return {covered: fields.length > 0, fields, note: null};
}

async function sdssSpectra(ra, dec) {
  const cmd = "SELECT TOP 10 CAST(s.specobjid AS VARCHAR(24)) AS sid, s.class, s.subclass, s.z, s.plate, s.mjd, s.fiberid, " +
    `s.survey, n.distance FROM dbo.fGetNearbySpecObjEq(${ra.toFixed(7)},${dec.toFixed(7)},0.05) n ` +
    "JOIN specobj s ON s.specobjid = n.specobjid ORDER BY n.distance";
  const r = await fetchTimeout(`${SDSS_BASE}/SkyServerWS/SearchTools/SqlSearch?format=json&cmd=${encodeURIComponent(cmd)}`, 40000);
  if (!r.ok) throw new Error("HTTP " + r.status);
  const rows = ((await r.json())[0] || {}).Rows || [];
  return rows.map((s) => ({specobjid: s.sid, cls: s.class, subclass: s.subclass, z: s.z, plate: s.plate, mjd: s.mjd,
    fiberid: s.fiberid, survey: s.survey, distance_arcsec: Math.round(s.distance * 6000) / 100,
    image: `${SDSS_BASE}/en/get/SpecById.ashx?id=${s.sid}`, explore: `${SDSS_BASE}/VisualTools/explore/summary?sid=${s.sid}`}));
}

function buildTable() {
  const tb = $("mtable");

    const tr = document.createElement("tr");
    tr.className = "mrow";
    tr.id = "row-" + m.key;

function renderRow(key) {
  const res = state.results[key];
  const tr = $("row-" + key);
  const cells = tr.querySelectorAll("td");
  if (res.error) {
    tr.classList.add("zero");
    cells[1].innerHTML = `<button class="retry" title="${esc(res.error)}">${t("retry")}</button>`;
    cells[1].querySelector("button").addEventListener("click", (e) => { e.stopPropagation(); runMission(key, state.id); });
    for (let i = 2; i < 7; i++) cells[i].textContent = "";
    return;
  }
  const n = res.n_done;
  tr.classList.toggle("zero", n === 0 && res.n_planned === 0);
  const note = res.expo_note ? (t("expoNote")[res.expo_note] || res.expo_note) : "";
  cells[1].innerHTML = `<span class="count">${fmtInt(n)}</span>` +
    (res.n_scw ? `<div class="muted" style="font-size:12px">${fmtInt(res.n_scw)} ScW</div>` : "");
  cells[2].textContent = res.n_planned ? fmtInt(res.n_planned) : "";
  cells[3].textContent = res.n_proprietary ? fmtInt(res.n_proprietary) : "";
  cells[4].innerHTML = n ? fmt(res.exposure_ks, 1) + (note ? ` <span class="muted" style="font-size:12px">${esc(note)}</span>` : "") : "";
  cells[5].textContent = res.first ? (res.first === res.last ? res.first : res.first + " – " + res.last) : "";
  const r = res.radius_arcmin;
  cells[6].textContent = r >= 60 ? fmt(r / 60, r % 60 ? 1 : 0) + "°" : fmt(r, r % 1 ? 1 : 0);
  applyHideZero();
}

function toggleDetail(key) {
  const res = state && state.results[key];
  if (!res || res.error || !res.observations.length) return;
  const tr = $("row-" + key), dt = $("det-" + key);
  const open = dt.classList.contains("hidden");
  if (open && !dt.dataset.filled) {
    const LIM = 1000;
    const obs = res.observations;
    const extraKeys = [...new Set(obs.flatMap((o) => Object.keys(o.extra || {})))];
    const rows = obs.slice(0, LIM).map((o) => {
      const badge = !o.done ? `<span class="badge b-plan">${esc(o.status || t("planned"))}</span>`
        : o.proprietary ? `<span class="badge b-warn">${t("proprietary")} ${esc(o.public_date)}</span>`
        : `<span class="badge b-ok">${esc(o.status || t("archived"))}</span>`;
      const id = o.link ? `<a href="${esc(o.link)}" target="_blank" rel="noopener">${esc(o.id)}</a>` : esc(o.id);
      return `<tr><td>${id}</td><td>${esc(o.name)}</td><td>${esc(o.date || "—")}</td>
        <td class="num">${fmt(o.exposure_ks, 2)}</td><td class="num">${fmt(o.offset_arcmin, 2)}</td><td>${badge}</td>
        ${extraKeys.map((k) => `<td>${esc((o.extra || {})[k] ?? "")}</td>`).join("")}</tr>`;
    }).join("");
    dt.firstElementChild.innerHTML = `<div class="tablewrap"><table>
      <thead><tr><th>${t("dId")}</th><th>${t("dTarget")}</th><th>${t("dDate")}</th><th class="num">${t("dExpo")}</th>
      <th class="num">${t("dOff")}</th><th>${t("dStatus")}</th>${extraKeys.map((k) => `<th>${esc(k)}</th>`).join("")}</tr></thead>
      <tbody>${rows}</tbody></table></div>
      ${obs.length > LIM ? `<p class="muted">${t("firstN")(LIM, fmtInt(obs.length))}</p>` : ""}`;
    dt.dataset.filled = "1";
  }
  dt.classList.toggle("hidden", !open);
  tr.classList.toggle("open", open);
}

// ---------------------------------------------------------------- plotting (Plotly, loaded on demand)
const PLOTLY_URL = "https://cdn.jsdelivr.net/npm/plotly.js-cartesian-dist-min@2.35.2/plotly-cartesian.min.js";
let plotlyReady = null;

function loadPlotly() {
  if (!plotlyReady) {
    plotlyReady = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = PLOTLY_URL;
      // Aladin Lite overwrites the global `self`, and Plotly's UMD wrapper registers itself on `self`.
      s.onload = () => {
        const P = window.Plotly || (window.self && window.self.Plotly);
        if (!P) { plotlyReady = null; reject(new Error("Plotly could not be loaded")); return; }
        window.Plotly = P;
        resolve(P);
      };
      s.onerror = () => { plotlyReady = null; reject(new Error("Plotly could not be loaded")); };
      document.head.append(s);
    });
  }
  return plotlyReady;
}

function plotTheme(extra) {
  const css = getComputedStyle(document.documentElement);
  const v = (n) => css.getPropertyValue(n).trim();
  const axis = {gridcolor: v("--line"), zerolinecolor: v("--line"), linecolor: v("--line"), color: v("--muted")};
  return Object.assign({paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)", font: {color: v("--ink"), size: 12},
    margin: {l: 64, r: 16, t: 16, b: 52}, xaxis: Object.assign({}, axis), yaxis: Object.assign({}, axis),
    legend: {font: {size: 11}}, hoverlabel: {font: {size: 12}}}, extra || {});
}

const PLOT_CONFIG = {responsive: true, displaylogo: false, modeBarButtonsToRemove: ["lasso2d", "select2d"]};

// ---------------------------------------------------------------- optical spectrum (SPARCL: SDSS / BOSS / DESI)
const SPARCL = "https://astrosparcl.datalab.noirlab.edu/api";
const SPEC_LINES = [["Lyα", 1215.67], ["N V", 1240.1], ["Si IV", 1398], ["C IV", 1549.1], ["C III]", 1908.7], ["Mg II", 2798.8],
  ["[O II]", 3727.4], ["Ca K", 3933.7], ["Ca H", 3968.5], ["Hδ", 4101.7], ["Hγ", 4340.5], ["Hβ", 4861.3], ["[O III]", 4958.9],
  ["[O III]", 5006.8], ["Mg b", 5175.3], ["Na D", 5892.9], ["[O I]", 6300.3], ["Hα", 6562.8], ["[N II]", 6583.5], ["[S II]", 6716.4],
  ["[S II]", 6730.8], ["Ca II", 8542.1]];

async function sparclPost(path, body, timeout) {
  const r = await fetchTimeout(SPARCL + path, timeout, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  if (!r.ok) throw new Error("SPARCL HTTP " + r.status);
  // specid is a 64-bit integer: keep it as text so it survives JSON parsing
  return JSON.parse((await r.text()).replace(/"specid":\s*(-?\d+)/g, '"specid":"$1"'));
}

async function findSpectra(ra, dec) {
  const r = 3 / 3600, dra = r / Math.max(Math.cos(dec * D2R), 1e-3);
  const ranges = ra - dra < 0 ? [[0, ra + dra], [360 + ra - dra, 360]]
    : ra + dra >= 360 ? [[ra - dra, 360], [0, ra + dra - 360]] : [[ra - dra, ra + dra]];
  const found = [];
  for (const [a, b] of ranges) {
    const d = await sparclPost("/find/?limit=50", {outfields: ["sparcl_id", "specid", "data_release", "redshift", "spectype", "ra", "dec"],
      search: [["ra", a, b], ["dec", dec - r, dec + r]]}, 30000);
    found.push(...d.slice(1));
  }
  return found.map((s) => Object.assign(s, {sep: sepDeg(ra, dec, s.ra, s.dec) * 3600}))
    .filter((s) => s.sep <= 3).sort((a, b) => a.sep - b.sep);
}

async function loadSpectrum(rec) {
  if (!rec.data) {
    rec.data = sparclPost("/spectras/?include=sparcl_id,flux,ivar,model,wavelength&format=json", [rec.sparcl_id], 60000)
      .then((d) => d[1]).catch((e) => { rec.data = null; throw e; });
  }
  return rec.data;
}

function boxcar(a, n) {
  if (n <= 1) return a;
  const h = Math.floor(n / 2), out = new Array(a.length);
  for (let i = 0; i < a.length; i++) {
    let s = 0, c = 0;
    for (let k = Math.max(0, i - h); k <= Math.min(a.length - 1, i + h); k++) if (Number.isFinite(a[k])) { s += a[k]; c++; }
    out[i] = c ? s / c : null;
  }
  return out;
}

function quantile(arr, q) {
  const v = arr.filter(Number.isFinite).sort((a, b) => a - b);
  if (!v.length) return NaN;
  return v[Math.min(v.length - 1, Math.max(0, Math.floor(q * (v.length - 1))))];
}

function specLinks(rec) {
  const links = [];
  if (/SDSS|BOSS/.test(rec.data_release) && rec.specid) links.push(["SkyServer", `${SDSS_BASE}/VisualTools/explore/summary?sid=${rec.specid}`]);
  links.push(["Legacy Survey viewer", `https://www.legacysurvey.org/viewer?ra=${rec.ra.toFixed(5)}&dec=${rec.dec.toFixed(5)}&layer=ls-dr10&zoom=16`]);
  return links;
}

async function drawSpectrum() {
  const sp = state && state.spec;
  if (!sp || !sp.list || !sp.list.length) return;
  const rec = sp.list[+$("spSel").value || 0];
  const zRaw = Number(rec.redshift);
  $("spInfo").innerHTML = esc(t("spLoading"));
  let d, P;
  try { [d, P] = await Promise.all([loadSpectrum(rec), loadPlotly()]); }
  catch (e) { $("spInfo").innerHTML = `<span class="err">${esc(t("spErr") + e.message)}</span>`; return; }
  if (state.spec !== sp) return;
  const rest = $("spRest").checked, z = Number.isFinite(zRaw) ? zRaw : 0;
  const wl = d.wavelength.map((w) => (rest ? w / (1 + z) : w));
  const flux = d.flux.map((f, i) => (d.ivar && d.ivar[i] > 0 ? f : null));
  const sm = boxcar(flux, +$("spBox").value);
  const lo = quantile(sm, 0.005), hi = quantile(sm, 0.995), pad = 0.12 * (hi - lo || 1);
  const traces = [{x: wl, y: flux, type: "scatter", mode: "lines", name: "flux", line: {color: "rgba(120,140,170,.45)", width: 1},
    hovertemplate: "λ %{x:.1f} Å<br>%{y:.3g}<extra>flux</extra>"}];
  if (+$("spBox").value > 1) traces.push({x: wl, y: sm, type: "scatter", mode: "lines", name: `${$("spBox").value} px`, line: {color: "#1f5fae", width: 1.4}, hoverinfo: "skip"});
  if ($("spModel").checked && d.model) traces.push({x: wl, y: d.model, type: "scatter", mode: "lines", name: "model", line: {color: "#d62728", width: 1.1}, hovertemplate: "λ %{x:.1f} Å<br>%{y:.3g}<extra>model</extra>"});
  const shapes = [], annotations = [];
  if ($("spLines").checked && Number.isFinite(zRaw)) {
    const [w0, w1] = [wl[0], wl[wl.length - 1]];
    SPEC_LINES.forEach(([name, lam], k) => {
      const x = rest ? lam : lam * (1 + z);
      if (x < w0 || x > w1) return;
      shapes.push({type: "line", x0: x, x1: x, yref: "paper", y0: 0, y1: 1, line: {color: "rgba(214,39,40,.35)", width: 1, dash: "dot"}});
      annotations.push({x, yref: "paper", y: k % 2 ? 0.93 : 0.99, text: name, showarrow: false, font: {size: 10, color: "#d62728"}, textangle: -90, xanchor: "right"});
    });
  }
  const layout = plotTheme({shapes, annotations, showlegend: true, legend: {orientation: "h", y: -0.2},
    margin: {l: 64, r: 16, t: 10, b: 70}});
  layout.xaxis.title = {text: t("spWave")(rest)};
  layout.yaxis.title = {text: t("spFlux")};
  layout.yaxis.range = [lo - pad, hi + pad];
  $("spPlot").classList.remove("hidden");
  await P.react("spPlot", traces, layout, PLOT_CONFIG);
  const links = specLinks(rec).map(([n, u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a>`).join(" · ");
  $("spInfo").innerHTML = esc(t("spInfo")({dr: rec.data_release, type: rec.spectype || "?", z: Number.isFinite(zRaw) ? zRaw.toFixed(5) : "?",
    sep: rec.sep.toFixed(2), n: d.wavelength.length})) + ` ${esc(t("spLinks"))} ${links}`;
}

function renderSpecList() {
  const sp = state.spec, el = $("sdss");
  $("specCtl").classList.add("hidden");
  $("spPlot").classList.add("hidden");
  $("spInfo").textContent = "";
  el.classList.add("muted");
  if (!sp) { el.innerHTML = `<span class="spin"></span> ${esc(t("spSearching"))}`; return; }
  if (sp.list && !sp.list.length) { el.textContent = t("spNone"); return; }
  if (sp.list) {
    el.textContent = "";
    $("spSel").innerHTML = sp.list.map((s, i) => `<option value="${i}">${esc(s.data_release)} · ${esc(s.spectype || "?")} · z=${Number(s.redshift).toFixed(4)} · ${s.sep.toFixed(1)}″</option>`).join("");
    $("specCtl").classList.remove("hidden");
    drawSpectrum();
    return;
  }
  // SPARCL failed: list what SkyServer knows, with links
  el.innerHTML = `<span class="err">${esc(t("spErr") + sp.error)}</span>` + (sp.fallback && sp.fallback.length
    ? `<div style="margin-top:6px">${esc(t("spFallback"))} ` + sp.fallback.map((s) =>
      `<a href="${esc(s.explore)}" target="_blank" rel="noopener">${esc(s.cls)} z=${Number(s.z).toFixed(4)} (${esc(s.survey)})</a>`).join(" · ") + "</div>" : "");
}

async function runSpectra(sid) {
  $("spec").classList.remove("hidden");
  state.spec = null;
  renderSpecList();
  let sp;
  try { sp = {list: await findSpectra(state.src.ra, state.src.dec)}; }
  catch (e) {
    sp = {error: e.message};
    try { sp.fallback = await sdssSpectra(state.src.ra, state.src.dec); } catch (e2) { sp.fallback = []; }
  }
  if (sid !== searchSeq) return;
  state.spec = sp;
  renderSpecList();
}

function spectrumCsv() {
  const sp = state && state.spec;
  if (!sp || !sp.list) return;
  const rec = sp.list[+$("spSel").value || 0];
  loadSpectrum(rec).then((d) => {
    const lines = ["wavelength_A,flux_1e-17_erg_s_cm2_A,ivar,model"];
    d.wavelength.forEach((w, i) => lines.push([w, d.flux[i], d.ivar ? d.ivar[i] : "", d.model ? d.model[i] : ""].join(",")));
    saveText(`spectrum_${rec.data_release}_${rec.sparcl_id}.csv`, lines.join("\n"));
  });
}

function initMapControls() {
  $("base").addEventListener("change", setBase);
  $("overlay").addEventListener("change", setOverlay);
  $("showPts").addEventListener("change", () => pointCats.forEach((c) => ($("showPts").checked ? c.show() : c.hide())));
  $("opacity").addEventListener("input", () => {
    const layer = aladin && aladin.getOverlayImageLayer && aladin.getOverlayImageLayer("overlay");
    if (layer) layer.setOpacity($("opacity").value / 100);
  });
}

async function hipsSource(id) {
  if (hipsCache[id]) return hipsCache[id];
  for (const url of HIPS_BY_ID[id][3]) {
    try {
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 6000);
      const r = await fetch(url + "/properties", {signal: ctl.signal});
      clearTimeout(timer);
      if (r.ok) return (hipsCache[id] = url);
    } catch (e) { /* try next mirror */ }
  }
  return (hipsCache[id] = id);
}

async function setBase() {
  if (!aladin) return;
  const id = $("base").value;
  const src = await hipsSource(id);
  if ($("base").value === id) aladin.setBaseImageLayer(A.imageHiPS(src, {name: hipsLabel(id)}));
}

async function setOverlay() {
  if (!aladin) return;
  const id = $("overlay").value;
  try { aladin.removeImageLayer("overlay"); } catch (e) { /* none yet */ }
  if (!id) return;
  const src = await hipsSource(id);
  if ($("overlay").value !== id) return;
  const layer = aladin.setOverlayImageLayer(A.imageHiPS(src, {name: hipsLabel(id)}), "overlay");
  if (layer && layer.setOpacity) layer.setOpacity($("opacity").value / 100);
}

function waitAladin() {
  if (aladinReady) return aladinReady;
  aladinReady = new Promise((resolve, reject) => {
    const start = Date.now();
    (function poll() {
      if (window.A && A.init) return A.init.then(resolve, reject);
      if (Date.now() - start > 20000) return reject(new Error(t("aladinFail")));
      setTimeout(poll, 150);
    })();
  });
  return aladinReady;
}

async function showMap(src) {
  $("extras").classList.remove("hidden");
  try { await waitAladin(); } catch (e) { $("aladin").innerHTML = `<p style="color:#fff;padding:12px">${esc(e.message)}</p>`; return; }
  const target = `${src.ra} ${src.dec}`;
  if (!aladin) {
    const base = await hipsSource($("base").value);
    aladin = A.aladin("#aladin", {survey: base, fov: 0.6, target, showReticle: true,
      showLayersControl: true, showFullscreenControl: true, showCooGridControl: true, showSimbadPointerControl: false,
      showProjectionControl: false, showFrame: true, hipsList: []});
    setOverlay();
  } else {
    aladin.removeLayers();
    pointCats = [];
    aladin.gotoRaDec(src.ra, src.dec);
    aladin.setFoV(0.6);
  }
  const g = A.graphicOverlay({color: "#ffffff", lineWidth: 1.5, name: "Source"});
  aladin.addOverlay(g);
  g.add(A.circle(src.ra, src.dec, 10 / 3600));
  (state.pendingPlots || []).forEach(([k, r]) => plotPointings(k, r));
  state.pendingPlots = [];
}

function plotPointings(key, res) {
  if (!res.observations.length) return;
  if (!aladin) { state.pendingPlots.push([key, res]); return; }
  const idx = MISSIONS.findIndex((m) => m.key === key);
  const color = COLORS[idx % COLORS.length];
  const cat = A.catalog({name: `${res.label} (${res.observations.length})`, color, sourceSize: 9, shape: "circle"});
  aladin.addCatalog(cat);
  pointCats.push(cat);
  if (!$("showPts").checked) cat.hide();
  const seen = new Set();
  const srcs = [];
  res.observations.forEach((o) => {
    if (o.ra == null || o.dec == null) return;
    const k = o.ra.toFixed(4) + "," + o.dec.toFixed(4);
    if (seen.has(k)) return;
    seen.add(k);
    srcs.push(A.source(o.ra, o.dec, {ObsID: o.id, Target: o.name, Date: o.date, Exposure_ks: o.exposure_ks}));
  });
  cat.addSources(srcs);
  $("legend").insertAdjacentHTML("beforeend", `<span><span class="dot" style="background:${color}"></span>${esc(res.label)}</span>`);
}

// ---------------------------------------------------------------- optical / X-ray / radio panels
const BANDS = ["opt", "x", "radio"];
let panels = null;
const panelNotes = {};

function buildPanelSelects() {
  for (const band of BANDS) {
    const sel = document.querySelector(`.panel[data-band=${band}] select`), v = sel.value;
    sel.innerHTML = HIPS.filter((h) => h[2] === band).map((h) => `<option value="${h[0]}">${esc(hipsLabel(h[0]))}</option>`).join("");
    if (v) sel.value = v;
  }
  renderPanelNotes();
}

function renderPanelNotes() {
  for (const band of BANDS) {
    const n = panelNotes[band];
    document.querySelector(`.panel[data-band=${band}] .pnote`).textContent = n ? (t("pickedBecause")[n] || "") : "";
  }
}

async function reachable(id) { return HIPS_BY_ID[id][3].length > 0 && (await hipsSource(id)) !== id; }

async function pickFirst(cands) {
  for (const [id, why] of cands) if (await reachable(id)) return [id, why];
  return cands.length ? [cands[0][0], "fallback"] : null;
}

async function setPanel(band, id, why) {
  if (!panels) return;
  const src = await hipsSource(id);
  panels[band].setBaseImageLayer(A.imageHiPS(src, {name: hipsLabel(id)}));
  document.querySelector(`.panel[data-band=${band}] select`).value = id;
  panelNotes[band] = why || null;
  renderPanelNotes();
}

function radioCandidates(dec) {
  return HIPS.filter((h) => h[2] === "radio" && inDec(DEC_COVER[h[0]], dec)).map((h) => [h[0], "radio"]);
}

async function pickXrayPanel(sid) {
  const res = state.results;
  const cands = [];
  if (res.chandra && res.chandra.n_done > 0) cands.push(["cxc.harvard.edu/P/cda/hips/allsky/rgb", "chandra"]);
  if (res.xmm && res.xmm.n_done > 0) cands.push(["ESDC/P/XMM/EPIC-RGB", "xmm"]);
  const l = state.src.l;
  if (l > 179.9442 && l < 359.9442) cands.push(["erosita/dr1/rate/rgb", "erosita"]);
  cands.push(["ov-gso/P/RASS", "rass"]);
  const pick = await pickFirst(cands);
  if (sid === searchSeq && pick) setPanel("x", pick[0], pick[1]);
}

async function showPanels(src, sid) {
  $("images").classList.remove("hidden");
  try { await waitAladin(); } catch (e) { $("v-opt").innerHTML = `<p style="color:#fff;padding:12px">${esc(e.message)}</p>`; return; }
  if (sid !== searchSeq) return;
  const fov = 0.25;
  if (!panels) {
    const start = await hipsSource("CDS/P/DSS2/color");
    if (panels) return;
    const made = {};
    for (const band of BANDS) {
      made[band] = A.aladin("#v-" + band, {survey: start, fov, target: `${src.ra} ${src.dec}`,
        showReticle: true, showLayersControl: false, showCooGridControl: false, showSimbadPointerControl: false,
        showProjectionControl: false, showFrame: false, showCooLocation: false, showFullscreenControl: true,
        showZoomControl: true, showSettingsControl: false, showShareControl: false, hipsList: []});
    }
    panels = made;
    for (const band of BANDS) {
      const me = panels[band];
      const others = () => BANDS.filter((b) => b !== band).map((b) => panels[b]);
      me.on("positionChanged", (p) => others().forEach((o) => {
        const [ra, dec] = o.getRaDec();
        if (Math.abs(ra - p.ra) > 1e-7 || Math.abs(dec - p.dec) > 1e-7) o.gotoRaDec(p.ra, p.dec);
      }));
      me.on("zoomChanged", (f) => others().forEach((o) => { if (Math.abs(o.getFov()[0] - f) > 1e-6) o.setFoV(f); }));
      document.querySelector(`.panel[data-band=${band}] select`).addEventListener("change", (ev) => setPanel(band, ev.target.value, null));
    }
  } else {
    for (const band of BANDS) { panels[band].removeLayers(); panels[band].gotoRaDec(src.ra, src.dec); panels[band].setFoV(fov); }
  }
  for (const band of BANDS) {
    const g = A.graphicOverlay({color: "#ffffff", lineWidth: 1.5});
    panels[band].addOverlay(g);
    g.add(A.circle(src.ra, src.dec, 8 / 3600));

  setPanel("opt", "CDS/P/DSS2/color", null);
  const radio = await pickFirst(radioCandidates(src.dec));
  if (radio && sid === searchSeq) setPanel("radio", radio[0], radio[1]);
  if (state.results.chandra && state.results.xmm && !state.xrayPicked) { state.xrayPicked = true; pickXrayPanel(sid); }
}

// ---------------------------------------------------------------- catalogue table
const SUP = {"-": "⁻", "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹"};
const RADIO_ORDER = ["vlass", "nvss", "first", "racs", "sumss", "wenss", "gleam", "tgss", "lotss"];

function fmtFlux(v, eneg, epos, unit) {
  if (v == null) return "—";
  const sci = /erg/.test(unit || "") && v !== 0;
  const ex = sci ? Math.floor(Math.log10(Math.abs(v))) : 0;
  const s = (x) => (x == null ? null : x / 10 ** ex);
  const m = s(v), en = s(eneg), ep = s(epos);
  let txt = Number(m.toPrecision(3)).toString();
  if (en != null && ep != null && en > 0 && ep > 0) {
    const big = Math.max(en, ep);
    if (big / Math.abs(m) < 0.001) {
      txt += " ± <0.1%";
    } else {
      // two significant digits in the error, value rounded to the same decimal place
      const d = Math.min(4, Math.max(0, 1 - Math.floor(Math.log10(Math.min(en, ep)))));
      txt = Math.abs(en - ep) <= 0.1 * big ? `${m.toFixed(d)} ± ${((en + ep) / 2).toFixed(d)}`
        : `${m.toFixed(d)} +${ep.toFixed(d)}/−${en.toFixed(d)}`;
    }
  }
  if (sci) txt = `${/ /.test(txt) ? `(${txt})` : txt} × 10${String(ex).split("").map((c) => SUP[c]).join("")}`;
  return txt;
}

function fmtParam(v) {
  if (v == null || v === "") return null;
  if (typeof v === "number") return Number(v.toPrecision(3)).toString();
  return String(v);
}

function catRow(c, res, live) {
  const head = `<td><b>${esc(c.label)}</b>${live ? `<div class="params">${t("liveQuery")}</div>` : ""}</td><td>${esc(c.band)}</td>`;
  if (!res) return `<tr>${head}<td colspan="4" class="muted"><span class="spin"></span> ${t("catLoading")}</td></tr>`;
  if (res.error) return `<tr class="nomatch">${head}<td colspan="4">${esc(res.error)}</td></tr>`;
  if (!res.hits.length) return `<tr class="nomatch">${head}<td colspan="4">${res.covered ? t("noMatch")(c.match) : t("outside")}</td></tr>`;
  const h = res.hits[0];
  const unit = c.unit || "mJy";
  const params = [];
  if (h.poserr != null) params.push(`${t("cPosErr")} ${fmtParam(h.poserr)}″${c.poserr_note ? " (" + c.poserr_note + ")" : ""}`);
  (c.params || []).forEach((label, i) => { const v = fmtParam(h.params[i]); if (v != null) params.push(`${label}: ${v}`); });
  if (res.hits.length > 1) params.push(t("more")(res.hits.length - 1));
  return `<tr>${head}<td class="flux">${fmtFlux(h.flux, h.eneg, h.epos, unit)} <span class="muted" style="font-weight:400;font-size:12px">${esc(unit)}</span></td>
    <td class="num">${fmt(h.sep, 1)}</td><td>${esc(h.name || "")}</td><td class="params">${params.map(esc).join(" · ")}</td></tr>`;
}

    {id: "swift", label: {en: "Swift-XRT stacked (counts)", tr: "Swift-XRT birleşik (sayım)"}, bases: ["https://skyview.gsfc.nasa.gov/surveys/xrt/cnt/all_clipped"], fmt: "fits", unit: "counts", fov: 8, sig: 6},
